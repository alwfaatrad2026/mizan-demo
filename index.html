function demoPost(){
  const P=(date,source,memo,lines,extra)=>Ledger.post(Object.assign({no:nextNo(source==="Sales Invoice"?"SI":source==="Purchase Invoice"?"PI":source==="Receipt"?"RV":source==="Payment"?"PV":"JV"),
    date,source,memo,lines},extra||{}));
  const M=n=>"2026-"+String(n).padStart(2,"0");

  /* opening position */
  P(M(1)+"-01","Journal","Opening balances brought forward",[
    {account:"1120",dr:2800000,cr:0},{account:"1121",dr:450000,cr:0},
    {account:"1110",dr:25000,cr:0},{account:"1111",dr:8000,cr:0},
    {account:"3100",dr:0,cr:2000000},{account:"3300",dr:0,cr:1283000}]);

  /* fixed assets */
  [["Toyota Hilux Double Cab — plate 447821","Motor Vehicles","2026-01-10",96000,5,10000],
   ["Nissan Urvan Crew Bus — plate 331902","Motor Vehicles","2026-01-10",78000,5,8000],
   ["JCB 3CX Backhoe Loader","Machinery & Heavy Equipment","2026-02-05",340000,8,40000],
   ["Office workstations & meeting room","Furniture & Fixtures","2026-01-15",64000,5,0],
   ["Dell laptops, server & network rack","Office & IT Equipment","2026-01-20",52000,4,0],
   ["Core drilling & cable pulling tool set","Tools & Small Plant","2026-03-01",28000,3,0]
  ].forEach((a,i)=>{
    const tag="FA-"+String(DB.assets.length+1).padStart(4,"0"), aid="A"+Date.now()+"-"+i;
    DB.assets.push({id:aid,tag,name:a[0],cat:a[1],serial:"",date:a[2],cost:a[3],residual:a[5],
      life:a[4],custodian:"Head office",deprTo:"",status:"In use"});
    P(a[2],"Asset Acquisition","Acquisition of "+a[0]+" ("+tag+")",[
      {account:tagCode("fa:"+a[1]),dr:a[3],cr:0,party:aid},{account:"1120",dr:0,cr:a[3]}]);
  });

  /* goods received */
  [[M(1)+"-18","S001","PI-REF-3391",[["IT05",22,2280],["IT03",180,168]]],
   [M(2)+"-06","S002","AJ-8842",[["IT01",4200,29.4],["IT02",34,505],["IT06",18,1890]]],
   [M(3)+"-12","S003","EC-1120",[["IT04",1400,13.2]]],
   [M(5)+"-09","S002","AJ-9107",[["IT01",2600,30.8],["IT02",22,512]]],
   [M(6)+"-21","S001","PI-REF-3688",[["IT05",14,2410]]]
  ].forEach(g=>{
    const no=nextNo("PI"), sup=DB.suppliers.find(s=>s.id===g[1]);
    const byAcct={}; let tot=0;
    g[3].forEach(l=>{ const it=DB.items.find(x=>x.id===l[0]); const val=R2(l[1]*l[2]);
      byAcct[it.acct]=R2((byAcct[it.acct]||0)+val); tot=R2(tot+val); });
    const lines=Object.keys(byAcct).map(a=>({account:a,dr:byAcct[a],cr:0,memo:"Goods received"}));
    lines.push({account:"2110",dr:0,cr:tot,party:g[1],memo:"Supplier invoice "+g[2]});
    Ledger.post({no,date:g[0],source:"Purchase Invoice",memo:"Goods for stock — "+sup.name,lines,
      doc:{no,date:g[0],due:addDays(g[0],sup.terms),party:g[1],type:"Goods for stock",ref:g[2],project:"",gross:tot,retention:0,receivable:tot}});
    g[3].forEach(l=>moveStock(l[0],l[1],l[2],"GRN "+no,g[0],""));
  });

  /* trading sales */
  [[M(2)+"-11","C003",[["IT01",850,38.5],["IT02",6,640]]],
   [M(3)+"-04","C004",[["IT06",5,2380],["IT03",40,210]]],
   [M(4)+"-19","C003",[["IT04",600,16.75],["IT05",6,2650]]],
   [M(6)+"-08","C004",[["IT01",1100,38.5]]],
   [M(7)+"-15","C003",[["IT02",9,640],["IT06",4,2380]]]
  ].forEach(s=>{
    const no=nextNo("SI"), cust=DB.customers.find(c=>c.id===s[1]);
    let tot=0, cogs=0; const byAcct={};
    s[2].forEach(l=>{ const it=DB.items.find(x=>x.id===l[0]); tot=R2(tot+l[1]*l[2]);
      const c=R2(l[1]*it.cost); cogs=R2(cogs+c); byAcct[it.acct]=R2((byAcct[it.acct]||0)+c); });
    const lines=[{account:"1130",dr:tot,cr:0,party:s[1],memo:"Invoice value"},{account:"4100",dr:0,cr:tot,memo:"Trading sales"}];
    if(cogs){ lines.push({account:"5100",dr:cogs,cr:0,memo:"Cost of goods sold"});
      Object.keys(byAcct).forEach(a=>lines.push({account:a,dr:0,cr:byAcct[a],memo:"Stock relieved"})); }
    Ledger.post({no,date:s[0],source:"Sales Invoice",memo:"Trading invoice to "+cust.name,lines,
      doc:{no,date:s[0],due:addDays(s[0],cust.terms),party:s[1],type:"Trading invoice",project:"",gross:tot,retention:0,receivable:tot,lines:[]}});
    s[2].forEach(l=>moveStock(l[0],-l[1],0,"Sale "+no,s[0],""));
  });

  /* advance payments received from clients against bank guarantees,
     posted before the first certificate that recovers them */
  [["P001","C001",1,"18",420000,"APG-QNB-2601"],["P003","C003",3,"16",88000,"APG-CBQ-2603"]].forEach(a=>{
    const date=M(a[2])+"-"+a[3], no=nextNo("RV");
    Ledger.post({no,date,source:"Advance Received",project:a[0],
      memo:"Advance received from "+custName(a[1])+" — "+projCode(a[0])+" · "+a[5],
      lines:[{account:"1120",dr:a[4],cr:0,party:a[1],project:a[0],memo:"Advance received"},
             {account:"2130",dr:0,cr:a[4],party:a[1],project:a[0],memo:"Advance from "+custName(a[1])+" · "+a[5]}],
      doc:{no,party:a[1],into:"1120",mode:"Advance",ref:a[5]}});
  });

  /* advance paid to the MEP subcontractor for mobilisation */
  (function(){
    const date=M(3)+"-06", no=nextNo("PV"), amt=180000;
    Ledger.post({no,date,source:"Advance Paid",project:"P001",
      memo:"Advance paid to "+suppName("S004")+" — PRJ-2601 · APG-SUB-114",
      lines:[{account:"1150",dr:amt,cr:0,party:"S004",project:"P001",memo:"Advance to "+suppName("S004")+" · APG-SUB-114"},
             {account:"1120",dr:0,cr:amt,party:"S004",project:"P001",memo:"Advance paid"}],
      doc:{no,party:"S004",from:"1120",mode:"Advance",ref:"APG-SUB-114"}});
  })();

  /* contract certificates */
  const certs=[["P001","C001",[[3,620000],[5,740000],[7,690000]]],
               ["P002","C002",[[3,310000],[5,395000],[7,288000]]],
               ["P003","C003",[[4,240000],[6,275000]]],
               ["P004","C004",[[5,42000],[7,38000]]]];
  certs.forEach(c=>{
    const proj=DB.projects.find(p=>p.id===c[0]), cust=DB.customers.find(x=>x.id===c[1]);
    c[2].forEach((cert,i)=>{
      const no=nextNo("SI"), date=M(cert[0])+"-25", gross=cert[1];
      const ret=R2(gross*proj.retention/100);
      const adv=(i===0&&proj.advance)?R2(proj.advance*0.34):0;
      const lines=[{account:"1130",dr:R2(gross-ret-adv),cr:0,party:c[1],project:c[0],memo:"Certificate "+(i+1)}];
      if(ret) lines.push({account:"1131",dr:ret,cr:0,party:c[1],project:c[0],memo:"Retention withheld"});
      if(adv) lines.push({account:"2130",dr:adv,cr:0,party:c[1],project:c[0],memo:"Advance recovered"});
      lines.push({account:"4200",dr:0,cr:gross,project:c[0],memo:"Work certified"});
      Ledger.post({no,date,source:"Sales Invoice",project:c[0],memo:"IPC "+(i+1)+" — "+proj.code,lines,
        doc:{no,date,due:addDays(date,cust.terms),party:c[1],type:"Contract certificate",project:c[0],
          gross,retention:ret,advance:adv,receivable:R2(gross-ret-adv),lines:[]}});
    });
  });

  /* subcontract & direct project costs */
  [["P001","S004",4,285000,90000],["P001","S004",6,310000,60000],["P002","S004",5,168000,0],["P003","S003",5,96000,0]].forEach(s=>{
    const no=nextNo("PI"), date=M(s[2])+"-20", gross=s[3], ret=R2(gross*0.1), adv=s[4]||0;
    const lines=[{account:"5200",dr:gross,cr:0,project:s[0],memo:"Subcontract works"},
                 {account:"2110",dr:0,cr:R2(gross-ret-adv),party:s[1],project:s[0],memo:"Payable"},
                 {account:"2115",dr:0,cr:ret,party:s[1],project:s[0],memo:"Retention withheld"}];
    if(adv) lines.push({account:"1150",dr:0,cr:adv,party:s[1],project:s[0],memo:"Advance recovered"});
    Ledger.post({no,date,source:"Purchase Invoice",project:s[0],memo:"Subcontract certificate — "+suppName(s[1]),lines,
      doc:{no,date,due:addDays(date,60),party:s[1],type:"Subcontractor certificate",project:s[0],
        gross,retention:ret,advance:adv,receivable:R2(gross-ret-adv)}});
  });
  [["P001",3,"5210",180000],["P001",5,"5230",64000],["P001",6,"5240",38000],
   ["P002",4,"5210",96000],["P002",6,"5230",29000],
   ["P003",4,"5210",118000],["P003",5,"5240",21000],
   ["P004",5,"5240",12000],["P004",7,"5210",16000]].forEach(x=>{
    const no=nextNo("PI"), date=M(x[1])+"-14";
    Ledger.post({no,date,source:"Purchase Invoice",project:x[0],memo:acctName(x[2])+" — "+projCode(x[0]),
      lines:[{account:x[2],dr:x[3],cr:0,project:x[0],memo:"Direct cost"},
             {account:"2110",dr:0,cr:x[3],party:"S001",project:x[0],memo:"Supplier invoice"}],
      doc:{no,date,due:addDays(date,45),party:"S001",type:"Direct project cost",project:x[0],gross:x[3],retention:0,receivable:x[3]}});
  });

  /* collections and payments */
  openDocs("SI").filter((d,i)=>i%3!==2).forEach(d=>{
    const no=nextNo("RV"), date=addDays(d.due,-4);
    if(date>today()) return;
    Ledger.post({no,date,source:"Receipt",memo:"Bank transfer received from "+custName(d.party),
      lines:[{account:"1120",dr:d.receivable,cr:0,party:d.party,memo:"Receipt"},
             {account:"1130",dr:0,cr:d.receivable,party:d.party,memo:"Collection against "+d.no}],
      doc:{no,party:d.party,into:"1120",mode:"Bank transfer",ref:""},allocs:[{doc:d.no,amt:d.receivable}]});
  });
  openDocs("PI").filter((d,i)=>i%3!==1).forEach(d=>{
    const no=nextNo("PV"), date=addDays(d.due,-2);
    if(date>today()) return;
    Ledger.post({no,date,source:"Payment",memo:"Payment to "+suppName(d.party),
      lines:[{account:"2110",dr:d.receivable,cr:0,party:d.party,memo:"Settlement of "+d.no},
             {account:"1120",dr:0,cr:d.receivable,party:d.party,memo:"Bank transfer"}],
      doc:{no,party:d.party,from:"1120",mode:"Bank transfer",ref:""},allocs:[{doc:d.no,amt:d.receivable}]});
  });

  /* overheads */
  const oh=[["6200",42000,"Office and store rent"],["6205",9800,"Kahramaa electricity and water"],
    ["6210",4600,"Telephone and internet"],["6300",11200,"Vehicle fuel and maintenance"],
    ["6305",7400,"Vehicle istimara and insurance"],["6115",13500,"Visa, QID and immigration charges"],
    ["6120",18000,"Medical insurance and health cards"],["6110",26000,"Staff accommodation and food"],
    ["6500",8600,"Commercial registration and trade licence"],["6505",3200,"Municipality and chamber fees"],
    ["6510",15000,"Legal and professional fees"],["6600",4900,"Printing and stationery"],
    ["6700",5300,"Bank charges and guarantee commission"],["6605",9200,"Advertising and marketing"]];
  for(let mth=1;mth<=8;mth++){
    const date=M(mth)+"-28"; if(date>today()) break;
    oh.forEach(o=>{
      const amt=R2(o[1]/8*(0.85+Math.random()*0.3));
      Ledger.post({no:nextNo("PV"),date,source:"Payment",memo:o[2],
        lines:[{account:o[0],dr:amt,cr:0,memo:o[2]},{account:"1120",dr:0,cr:amt,memo:"Paid by bank"}],doc:{no:"",from:"1120"}});
    });
  }

  /* payroll, gratuity, depreciation, petty cash */
  for(let mth=1;mth<=8;mth++){
    const end=monthEnd(M(mth)+"-01"); if(end>today()) break;
    const staff=DB.employees.filter(e=>e.active);
    const byAcct={};
    staff.forEach(e=>{ const k=(e.project?"5220":"6100")+"|"+(e.project||"");
      byAcct[k]=R2((byAcct[k]||0)+e.basic+e.allow); });
    const gross=R2(staff.reduce((s,e)=>s+e.basic+e.allow,0));
    const lines=Object.keys(byAcct).map(k=>{const [a,p]=k.split("|");
      return {account:a,dr:byAcct[k],cr:0,project:p,memo:"Payroll "+end};});
    lines.push({account:"2125",dr:0,cr:gross,memo:"Net salaries payable"});
    Ledger.post({no:nextNo("JV"),date:end,source:"Payroll",memo:"Payroll for month ending "+fmtDate(end),lines});
    Ledger.post({no:nextNo("PV"),date:addDays(end,3),source:"Payment",memo:"Salary disbursement (WPS)",
      lines:[{account:"2125",dr:gross,cr:0,memo:"Salaries paid"},{account:"1120",dr:0,cr:gross,memo:"WPS transfer"}],doc:{no:"",from:"1120"}});
    const gt=R2(staff.reduce((s,e)=>s+gratuityMonthly(e),0));
    Ledger.post({no:nextNo("JV"),date:end,source:"Gratuity",memo:"End-of-service provision for month ending "+fmtDate(end),
      lines:[{account:"6105",dr:gt,cr:0,memo:"Gratuity charge"}].concat(
        staff.map(e=>({account:"2210",dr:0,cr:gratuityMonthly(e),party:e.id,memo:e.name})))});
    Ledger.post({no:nextNo("TR"),date:M(mth)+"-05",source:"Transfer",memo:"Petty cash float top-up",
      lines:[{account:"1111",dr:6000,cr:0,memo:"Float"},{account:"1120",dr:0,cr:6000,memo:"Float"}]});
    const sitePetty=R2(3000+Math.random()*1500);
    Ledger.post({no:nextNo("PV"),date:M(mth)+"-22",source:"Payment",memo:"Petty cash site expenses",
      lines:[{account:"5240",dr:sitePetty,cr:0,project:"P001",memo:"Site consumables"},{account:"1111",dr:0,cr:sitePetty,memo:"Petty cash"}],doc:{no:"",from:"1111"}});
    /* depreciation */
    const due=DB.assets.filter(a=>monthEnd(a.date)<=end&&monthlyDep(a)>0);
    const tot=R2(due.reduce((s,a)=>s+monthlyDep(a),0));
    if(tot){
      Ledger.post({no:nextNo("JV"),date:end,source:"Depreciation",memo:"Depreciation charge to "+fmtDate(end),
        lines:[{account:"6800",dr:tot,cr:0,memo:"Depreciation"}].concat(
          due.map(a=>({account:tagCode("ad:"+a.cat),dr:0,cr:monthlyDep(a),party:a.id,memo:a.tag+" "+a.name})))});
      due.forEach(a=>a.deprTo=end);
    }
  }
  /* one staff advance still outstanding */
  Ledger.post({no:nextNo("PV"),date:M(7)+"-11",source:"Payment",memo:"Advance to Mohammed Iqbal",
    lines:[{account:"1155",dr:5000,cr:0,party:"E005",memo:"Salary advance"},{account:"1110",dr:0,cr:5000,memo:"Cash advance"}],doc:{no:"",from:"1110"}});
  /* make one project visibly overdue for the schedule flag */
  const p2=DB.projects.find(p=>p.id==="P002");
  if(p2){
    const base=addDays(today(),-75), step=addDays(today(),-49), final=addDays(today(),-23);
    p2.baselineEnd=base;
    p2.revisions=[
      {on:addDays(today(),-88),from:base,to:step,reason:"Client-approved extension of time — late handover of riser shafts",by:"Nasser Al Rayyan"},
      {on:addDays(today(),-55),from:step,to:final,reason:"Variation order issued — additional LV panels in block C",by:"Suresh Menon"}];
    p2.end=final; }
  const p3=DB.projects.find(p=>p.id==="P003");
  if(p3){ p3.baselineEnd=p3.end; p3.revisions=[]; p3.end=addDays(today(),-4); }
}

/* ================ SHARED-LINK ONBOARDING ==================
   A client opening a link has no idea what they are looking at.
   Shows once per browser; ?tour=0 suppresses it, and it can be
   reopened from Company Setup.                                     */
function welcomeGuide(){
  const co = isAR() && DB.company.nameAr ? DB.company.nameAr : DB.company.name;
  const b=document.createElement("div"); b.style.display="contents";
  b.appendChild(h('<div class="full"><p style="font-size:14.5px">'+esc(tp("welcomeLead"))+'</p>'+
    '<p style="margin-top:8px;color:var(--ink-soft)">'+esc(tp("welcomeCo",co))+'</p></div>'));
  const list=h('<div class="slip full"><b>'+esc(tp("welcomeTry"))+'</b><div class="slipnote"></div></div>');
  const ul=list.querySelector(".slipnote");
  ["welcomeT1","welcomeT2","welcomeT3","welcomeT4"].forEach((k,i)=>
    ul.appendChild(h('<p style="margin:'+(i?"9px":"0")+' 0 0;font-size:13px;line-height:1.5"><b style="font-family:var(--data);color:var(--maroon);margin-inline-end:7px">'+
      (i+1)+'</b>'+esc(tp(k))+'</p>')));
  b.appendChild(list);
  b.appendChild(h('<div class="full" style="border-top:1px solid var(--rule);padding-top:10px;color:var(--ink-soft);font-size:12.5px">'+
    esc(tp("welcomePriv"))+'</div>'));
  modal({title:"About this demo",wide:true,body:b,buttons:[
    {label:"Open Reports",fn:()=>{closeModal();CUR="reports";draw();}},
    {label:"Open Projects",fn:()=>{closeModal();CUR="projects";TAB.proj="";draw();}},
    {label:"Start looking around",pri:true,fn:closeModal}]});
}

/* ==================== BOOT ================================= */
async function boot(){
  DB = await Store.load();
  if(!DB || !DB.accounts) DB = seed();
  DB.stockMoves=DB.stockMoves||[]; DB.assets=DB.assets||[]; DB.journals=DB.journals||[];
  DB.items.forEach(i=>{ if(i.val==null) i.val=R2(i.qty*i.cost); });
  /* schedule baseline: every contract keeps its original end date and a revision log */
  DB.projects.forEach(p=>{ if(!p.baselineEnd) p.baselineEnd=p.end; if(!p.revisions) p.revisions=[]; });
  /* a shared link can preselect language and landing screen:
     .../mizan/?lang=ar        opens in Arabic
     .../mizan/?view=projects  opens on a given module
     .../mizan/?tour=0         skips the welcome guide            */
  let q={}; try{ q=Object.fromEntries(new URLSearchParams(location.search)); }catch(e){}
  if(q.lang==="ar"||q.lang==="en") DB.settings.lang=q.lang;
  LANG = DB.settings.lang || "en"; applyLang();
  if(q.view && VIEWS[q.view]) CUR=q.view;
  DB._tour = q.tour!=="0" && !DB.settings.welcomed;
  DB.seq=DB.seq||{SI:1000,PI:1000,RV:1000,PV:1000,JV:1000,TR:1000};
  if(!DB.journals.length) demoPost();
  save(); draw();
  if(DB._tour){ DB.settings.welcomed=true; delete DB._tour; save(); welcomeGuide(); }
}
/* debugging / integration hook — lets you inspect the live ledger from the console */
window.MIZAN={get DB(){return DB;},Ledger,R2,money,qr,projFlag,canPost,stockValue,draw,seed,demoPost,Store,
  check(){const p=postable();const net=R2(p.reduce((s,a)=>s+Ledger.bal(a.code),0));
    const A=Ledger.typeTotal("ASSET"),L=Ledger.typeTotal("LIABILITY"),E=Ledger.typeTotal("EQUITY"),N=Ledger.netProfit();
    return {entries:DB.journals.length,trialBalanceNet:net,balanceSheetDiff:R2(A-(L+E+N)),
      stockVsLedger:R2(stockValue()-R2(Ledger.show("1140")+Ledger.show("1141")))};}};

boot();
