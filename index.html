<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIZAN — Al-Rwfaa Trading and Contracting W.L.L.</title>
<meta name="description" content="Working demonstration of an accounting and contracting ERP built for Qatar.">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#191C1B;
  --ink-soft:#5A6362;
  --ink-faint:#8B9694;
  --paper:#F1F4F3;
  --surface:#FFFFFF;
  --field:#F7F9F8;
  --rule:#D6DBD9;
  --rule-strong:#AEB7B5;
  --maroon:#7A1226;
  --maroon-soft:#F6E7EA;
  --green:#14624A;
  --green-soft:#E4F0EB;
  --amber:#8A5A08;
  --amber-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(25,28,27,.06),0 8px 24px rgba(25,28,27,.07);
  --display:Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --data:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui-ar:"Noto Sans Arabic","Segoe UI",Tahoma,"Geeza Pro","Al Nile","Arabic Typesetting",system-ui,sans-serif;
  --display-ar:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;height:100%;grid-template-areas:"brand top" "rail main"}
.brand{grid-area:brand;background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #000}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:.14em;font-weight:400}
.brand span{font-family:var(--data);font-size:9px;letter-spacing:.18em;color:#8B9694;text-transform:uppercase}
.topbar{grid-area:top;background:var(--ink);color:#E9EDEC;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid #000}
.topbar .tstat{display:flex;flex-direction:column;line-height:1.2}
.topbar .tstat i{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8B9694;font-style:normal}
.topbar .tstat b{font-family:var(--data);font-size:13px;font-weight:500}
.topbar .spacer{flex:1}
.topbar select{background:#2A2E2D;border:1px solid #3C4241;color:#E9EDEC;border-radius:3px;padding:5px 8px;font-size:12px}

.rail{grid-area:rail;background:var(--surface);border-inline-end:1px solid var(--rule);overflow-y:auto;padding-bottom:30px}
.rail h6{font-family:var(--data);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:16px 18px 6px;font-weight:500}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:start;background:none;border:0;padding:7px 18px;cursor:pointer;color:var(--ink-soft);border-inline-start:2px solid transparent}
.navitem:hover{background:var(--field);color:var(--ink)}
.navitem.on{color:var(--maroon);border-inline-start-color:var(--maroon);background:var(--maroon-soft);font-weight:600}
.navitem em{font-family:var(--data);font-size:10px;font-style:normal;color:var(--ink-faint);width:22px}
.navitem.on em{color:var(--maroon)}
.navitem .flag{margin-inline-start:auto;background:var(--maroon);color:#fff;font-family:var(--data);font-size:10px;padding:0 5px;border-radius:8px}

.main{grid-area:main;overflow-y:auto;padding:22px 26px 60px}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-family:var(--display);font-size:25px;font-weight:400;letter-spacing:-.01em}
.pagehead p{color:var(--ink-soft);font-size:13px;max-width:56ch}
.pagehead .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink);background:var(--field)}
.btn.pri{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.pri:hover{background:#5E0D1D;border-color:#5E0D1D}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block}
label.f>i{display:block;font-family:var(--data);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-style:normal;margin-bottom:4px}
.inp{width:100%;background:var(--field);border:1px solid var(--rule);border-radius:3px;padding:7px 9px}
.inp:focus{background:#fff;border-color:var(--ink-soft)}
input.inp[type=number],input.inp[type=date]{font-family:var(--data)}
textarea.inp{min-height:58px;resize:vertical}

/* ---------- cards & tables ---------- */
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.card>header{padding:11px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.card>header h3{font-family:var(--display);font-size:15px;font-weight:400}
.card>header .r{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.card .body{padding:14px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px 14px}
.stat i{display:block;font-family:var(--data);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);font-style:normal}
.stat b{display:block;font-family:var(--data);font-size:22px;font-weight:500;margin-top:5px;letter-spacing:-.02em}
.stat small{color:var(--ink-faint);font-size:11.5px}

table{width:100%;border-collapse:collapse}
th{font-family:var(--data);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);text-align:start;padding:8px 10px;border-bottom:1px solid var(--rule-strong);font-weight:500;white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover{background:var(--field)}
tr.clickable{cursor:pointer}
.num{font-family:var(--data);text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.code{font-family:var(--data);font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.empty{padding:34px 14px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:4px;font-weight:400}
.scroll{overflow-x:auto}

.tag{display:inline-block;font-family:var(--data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--field);color:var(--ink-soft);border:1px solid var(--rule)}
.tag.red{background:var(--maroon-soft);color:var(--maroon);border-color:#E8C8CF}
.tag.green{background:var(--green-soft);color:var(--green);border-color:#C4DED4}
.tag.amber{background:var(--amber-soft);color:var(--amber);border-color:#EBD9B4}
.neg{color:var(--maroon)}
.pos{color:var(--green)}
.flagdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--maroon);margin-inline-end:6px;vertical-align:middle}

/* ---------- statement sheet (reports) ---------- */
.sheet{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:26px 30px;box-shadow:var(--shadow);max-width:940px}
.sheet .sh{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.sheet .sh h2{font-family:var(--display);font-size:19px;font-weight:400}
.sheet .sh p{font-family:var(--data);font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-top:3px}
.sheet table td{border-bottom:1px solid #EDF0EF}
.sheet tr.sub td{font-weight:600;border-top:1px solid var(--rule-strong);border-bottom:none}
.sheet tr.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:3px double var(--ink)}
.sheet tr.head td{font-family:var(--data);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);padding-top:16px}
.indent{padding-inline-start:26px!important}

/* ---------- modal + posting slip ---------- */
.veil{position:fixed;inset:0;background:rgba(25,28,27,.42);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:5px;width:100%;max-width:760px;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:rise .14s ease-out}
.modal.wide{max-width:1000px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center}
.modal>header h3{font-family:var(--display);font-size:17px;font-weight:400}
.modal>header .x{margin-inline-start:auto;background:none;border:0;font-size:21px;cursor:pointer;color:var(--ink-soft);line-height:1}
.mbody{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.mbody .full{grid-column:1/-1}
.modal>footer{padding:13px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;align-items:center}
.modal>footer .spacer{flex:1}

.slip{grid-column:1/-1;border:1px solid var(--rule-strong);border-radius:4px;background:var(--field);overflow:hidden}
.slip>b{display:flex;align-items:center;gap:8px;padding:8px 12px;font-family:var(--data);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);font-weight:500}
.slip>b .st{margin-inline-start:auto;letter-spacing:.06em}
.slip table{background:#fff}
.slip th{font-size:9px;padding:5px 12px}
.slip td{padding:5px 12px;font-size:12.5px}
.slip .an{font-family:var(--data);font-size:11.5px;color:var(--ink-soft)}
.slip tr.tot td{border-top:1px solid var(--ink);border-bottom:none;font-weight:700}
.slipnote{padding:8px 12px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--rule)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;z-index:80;display:none;box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-soft);font-size:13px;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:600}
.bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.bar label.f{min-width:130px}
.progress{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:5px}
.progress i{display:block;height:100%;background:var(--green)}
.progress i.over{background:var(--maroon)}
@media(max-width:880px){
  #app{grid-template-columns:1fr;grid-template-areas:"brand" "top" "main"}
  .rail{position:fixed;top:0;left:0;bottom:0;width:232px;z-index:60;transform:translateX(-100%);transition:transform .16s}
  .rail.open{transform:none}
  .mbody{grid-template-columns:1fr}
  .main{padding:16px}
}


/* ---------- language switch + right-to-left ---------- */
.langsw{display:flex;border:1px solid #3C4241;border-radius:3px;overflow:hidden}
.langsw button{background:#2A2E2D;border:0;color:#9AA4A2;padding:5px 11px;cursor:pointer;font-size:12px;line-height:1.3}
.langsw button:hover{color:#E9EDEC}
.langsw button.on{background:var(--maroon);color:#fff;font-weight:600}
html[dir=rtl] body{font-family:var(--ui-ar)}
html[dir=rtl] .pagehead h1,html[dir=rtl] .card>header h3,html[dir=rtl] .modal>header h3,
html[dir=rtl] .sheet .sh h2,html[dir=rtl] .empty b{font-family:var(--display-ar)}
html[dir=rtl] .brand b{letter-spacing:.06em}
html[dir=rtl] .navitem em,html[dir=rtl] .code,html[dir=rtl] .an{direction:ltr;unicode-bidi:embed}
html[dir=rtl] .num{direction:ltr}
html[dir=rtl] .tag{letter-spacing:0;text-transform:none}
html[dir=rtl] th{letter-spacing:0;text-transform:none;font-family:var(--ui-ar);font-size:11px}
html[dir=rtl] label.f>i,html[dir=rtl] .stat i,html[dir=rtl] .rail h6,html[dir=rtl] .slip>b{
  letter-spacing:0;text-transform:none;font-family:var(--ui-ar);font-size:11px}
html[dir=rtl] .stat b{direction:ltr;text-align:start}
@media(max-width:880px){html[dir=rtl] .rail{right:0;left:auto;transform:translateX(100%)}
  html[dir=rtl] .rail.open{transform:none}}
@media print{
  .rail,.topbar,.brand,.no-print,.pagehead .acts,.tabs,#toast{display:none!important}
  #app{display:block;height:auto}
  .main{overflow:visible;padding:0}
  body{background:#fff}
  .sheet{box-shadow:none;border:0;max-width:none;padding:0}
  .card{break-inside:avoid}
}
#burger{display:none;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
@media(max-width:880px){#burger{display:block}}
</style>
</head>

</div>
<div id="modalRoot"></div>
<div id="toast"></div>

function tp(key){

  let s=isAR()?e.ar:e.en;
  for(let i=1;i<arguments.length;i++) s=s.split("{"+(i-1)+"}").join(arguments[i]);
  return s;
}

const KEY = "mizan:db:v1";

const Store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  async save(db){
    const s = JSON.stringify(db);
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  },
  async wipe(){
    try{ if(window.storage){ await window.storage.delete(KEY); } }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ============================================================
   MIZAN ERP — 02 · ledger engine + UI kit
   Every module posts through Ledger.post(). Nothing anywhere
   writes a balance directly; all reports are derived.
   ============================================================ */
let DB = null;
const R2 = n => Math.round((Number(n)||0)*100)/100;
const money = n => (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const qr = n => isAR() ? money(n)+" ر.ق" : "QR " + money(n);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dnum = s => { const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; };
const daysBetween = (a,b) => Math.floor((dnum(b)-dnum(a))/86400000);
const addMonths = (iso,n) => { const d=dnum(iso); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); };
const monthEnd = iso => { const d=dnum(iso); return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10); };
const fmtDate = iso => { const d=dnum(iso); if(!d) return "—";
  return isAR() ? d.getDate()+" "+MONTHS_AR[d.getMonth()]+" "+d.getFullYear()
                : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };

const acct = code => DB.accounts.find(a=>a.code===code);
const acctName = code => { if(isAR()&&COA_AR[code]) return COA_AR[code]; const a=acct(code); return a?a.name:code; };
const byTag = tag => DB.accounts.find(a=>a.tag===tag);
const tagCode = tag => { const a=byTag(tag); return a?a.code:null; };
const postable = () => DB.accounts.filter(a=>!a.group);
const nextNo = p => { DB.seq[p]=(DB.seq[p]||1000)+1; return p+"-"+DB.seq[p]; };

const Ledger = {
  /* lines: [{account, dr, cr, memo, project, party}] */
  build(lines){
    return lines.filter(l=>l&&(R2(l.dr)||R2(l.cr)))
      .map(l=>{ if(!l.account) throw new Error("A line has an amount but no account."); return l; })
      .map(l=>({account:l.account,dr:R2(l.dr||0),cr:R2(l.cr||0),memo:l.memo||"",project:l.project||"",party:l.party||""}));
  },
  check(lines){
    const L=Ledger.build(lines);
    const dr=R2(L.reduce((s,l)=>s+l.dr,0)), cr=R2(L.reduce((s,l)=>s+l.cr,0));
    return {lines:L,dr,cr,diff:R2(dr-cr),ok:L.length>1&&R2(dr-cr)===0&&dr>0};
  },
  post(e){
    const c=Ledger.check(e.lines);
    if(!c.ok) throw new Error("Entry does not balance — out by "+qr(Math.abs(c.diff)));
    const j={id:"J"+Date.now()+Math.floor(Math.random()*90+10),no:e.no||nextNo("JV"),date:e.date||today(),
      memo:e.memo||"",source:e.source||"Journal",sourceId:e.sourceId||"",project:e.project||"",
      by:(DB.users.find(u=>u.id===DB.currentUser)||{}).name||"System",lines:c.lines,dr:c.dr,
      doc:e.doc||null,allocs:e.allocs||null};
    DB.journals.push(j); return j;
  },
  reverse(id){
    const j=DB.journals.find(x=>x.id===id); if(!j) return;
    return Ledger.post({date:today(),memo:"Reversal of "+j.no+" — "+j.memo,source:"Reversal",sourceId:j.no,
      lines:j.lines.map(l=>({account:l.account,dr:l.cr,cr:l.dr,memo:l.memo,project:l.project,party:l.party}))});
  },
  /* filters: {from,to,project,party,source} */
  entries(f){
    f=f||{};
    return DB.journals.filter(j=>{
      if(f.from && j.date<f.from) return false;
      if(f.to && j.date>f.to) return false;
      if(f.source && j.source!==f.source) return false;
      if(f.project && !j.lines.some(l=>l.project===f.project) && j.project!==f.project) return false;
      return true;
    }).sort((a,b)=> a.date<b.date?-1: a.date>b.date?1: a.no<b.no?-1:1);
  },
  /* natural debit-positive balance */
  bal(code,f){
    f=f||{}; let s=0;
    for(const j of Ledger.entries(f)) for(const l of j.lines){
      if(l.account!==code) continue;
      if(f.project && l.project!==f.project) continue;
      if(f.party && l.party!==f.party) continue;
      s += l.dr - l.cr;
    }
    return R2(s);
  },
  /* presentation balance: positive = normal side */
  show(code,f){
    const a=acct(code), b=Ledger.bal(code,f);
    return (a && (a.type==="LIABILITY"||a.type==="EQUITY"||a.type==="REVENUE")) ? R2(-b) : b;
  },
  rows(code,f){
    const out=[]; let run=0;
    for(const j of Ledger.entries(f)) for(const l of j.lines){
      if(l.account!==code) continue;
      if(f&&f.party&&l.party!==f.party) continue;
      if(f&&f.project&&l.project!==f.project) continue;
      run=R2(run+l.dr-l.cr);
      out.push({date:j.date,no:j.no,source:j.source,memo:l.memo||j.memo,dr:l.dr,cr:l.cr,run,project:l.project,party:l.party,jid:j.id});
    }
    return out;
  },
  partyBal(code,party){ return Ledger.bal(code,{party}); },
  typeTotal(type,f){
    return R2(postable().filter(a=>a.type===type).reduce((s,a)=>s+Ledger.show(a.code,f),0));
  },
  netProfit(f){
    return R2(Ledger.typeTotal("REVENUE",f) - Ledger.typeTotal("COS",f) - Ledger.typeTotal("EXPENSE",f));
  }
};

const $ = s => document.querySelector(s);
function h(html){ const tpl=document.createElement("template"); tpl.innerHTML=html.trim(); return tpl.content.firstElementChild; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.style.display="block"; clearTimeout(el._h); el._h=setTimeout(()=>el.style.display="none",2600); }

function table(cols,rows,opt){
  opt=opt||{};
  if(!rows.length) return h('<div class="empty"><b>'+esc(t(opt.emptyTitle||"Nothing here yet"))+'</b>'+esc(t(opt.emptyBody||""))+'</div>');
  const th=cols.map(c=>'<th'+(c.num?' class="num"':'')+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(t(c.h))+'</th>').join("");
  const wrap=h('<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody></tbody></table></div>');
  const tb=wrap.querySelector("tbody");
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    if(opt.onRow){ tr.className="clickable"; tr.onclick=()=>opt.onRow(r,i); }
    cols.forEach(c=>{
      const td=document.createElement("td");
      if(c.num) td.className="num";
      if(c.cls) td.className=(td.className+" "+c.cls(r)).trim();
      const v=c.r(r,i);
      if(v instanceof Node) td.appendChild(v); else td.innerHTML=v==null?"":v;
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  return wrap;
}

/* Field spec: {n,label,type,options,value,full,step,readonly,hint,min,max} */
function field(f){
  const id="f_"+f.n;
  let ctl;
  if(f.type==="select"){
    ctl='<select class="inp" id="'+id+'" name="'+f.n+'">'+(f.options||[]).map(o=>{
      const val=(typeof o==="object")?o.v:o, lab=(typeof o==="object")?o.l:o;
      return '<option value="'+esc(val)+'"'+(String(f.value)===String(val)?" selected":"")+'>'+esc(t(lab))+'</option>';
    }).join("")+'</select>';
  } else if(f.type==="textarea"){
    ctl='<textarea class="inp" id="'+id+'" name="'+f.n+'">'+esc(f.value||"")+'</textarea>';
  } else {
    ctl='<input class="inp" id="'+id+'" name="'+f.n+'" type="'+(f.type||"text")+'"'+
        (f.step?' step="'+f.step+'"':(f.type==="number"?' step="0.01"':""))+
        (f.min!=null?' min="'+f.min+'"':"")+(f.readonly?" readonly":"")+
        ' value="'+esc(f.value==null?"":f.value)+'">';
  }
  return h('<label class="f'+(f.full?" full":"")+'"><i>'+esc(t(f.label))+'</i>'+ctl+
    (f.hint?'<small style="color:var(--ink-faint);font-size:11.5px">'+esc(t(f.hint))+'</small>':"")+'</label>');
}

/* The signature element: a live posting slip under every form. */
function slip(check,note){
  const s=h('<div class="slip"><b>'+esc(t("Posting slip"))+' <span class="st"></span></b><div class="t"></div></div>');
  const st=s.querySelector(".st");
  if(check.ok){ st.innerHTML='<span class="tag green">'+esc(t("Balanced"))+'</span>'; }
  else if(!check.lines.length){ st.innerHTML='<span class="tag">'+esc(t("Nothing to post"))+'</span>'; }
  else { st.innerHTML='<span class="tag red">'+esc(tp("outBy",qr(Math.abs(check.diff))))+'</span>'; }
  const body=s.querySelector(".t");
  if(check.lines.length){
    body.appendChild(table([
      {h:"Account",r:l=>'<span class="an">'+esc(l.account)+'</span> '+esc(acctName(l.account))+(l.project?' <span class="tag">'+esc(projCode(l.project))+'</span>':"")},
      {h:"Debit",num:1,r:l=>l.dr?money(l.dr):""},
      {h:"Credit",num:1,r:l=>l.cr?money(l.cr):""}
    ],check.lines));
    const tb=body.querySelector("tbody");
    tb.appendChild(h('<tr class="tot"><td>'+esc(t("Total"))+'</td><td class="num">'+money(check.dr)+'</td><td class="num">'+money(check.cr)+'</td></tr>'));
  }
  if(note) s.appendChild(h('<div class="slipnote">'+note+'</div>'));
  return s;
}

/* Form modal with live posting preview.
   o: {title, fields(v), journal(v), note(v), save(v), wide, saveLabel} */
function formDoc(o){
  const v={}; (o.fields({})||[]).forEach(f=>v[f.n]=f.value==null?"":f.value);
  let container, prev=null;
  function render(){
    /* Fields may declare syncOn:"otherField" — when that field changes, this one
       is reset to the default the spec now computes (e.g. amount follows invoice). */
    let fields=o.fields(v);
    for(let pass=0;pass<3;pass++){
      let changed=false;
      fields.forEach(f=>{
        if(f.type==="lines"){
          /* a line's shape belongs to its document type — rebuild rather than
             carry stale columns across a type change */
          if(!Array.isArray(v[f.n])) { v[f.n]=[f.newRow()]; return; }
          if(f.syncOn && prev && prev[f.syncOn]!==v[f.syncOn]){ v[f.n]=[f.newRow()]; changed=true; }
          return;
        }
        if(!(f.n in v)){ v[f.n]=f.value==null?"":f.value; return; }
        if(f.syncOn && prev && prev[f.syncOn]!==v[f.syncOn] && String(v[f.n])!==String(f.value==null?"":f.value)){
          v[f.n]=f.value==null?"":f.value; changed=true;
        }
      });
      if(!changed) break;
      fields=o.fields(v);
    }
    prev=Object.assign({},v);
    const frag=document.createDocumentFragment();
    fields.forEach(f=>{
      if(f.type==="html"){ frag.appendChild(h('<div class="full">'+f.value+'</div>')); return; }
      if(f.type==="lines"){ if(!Array.isArray(v[f.n])) v[f.n]=[f.newRow()]; frag.appendChild(lineEditor(f,v,redraw)); return; }
      const el=field(Object.assign({},f,{value:v[f.n]}));
      const ctl=el.querySelector("input,select,textarea");
      ctl.oninput=()=>{ v[f.n]=ctl.value; if(f.live!==false) redraw(); };
      ctl.onchange=()=>{ v[f.n]=ctl.value; redraw(); };
      frag.appendChild(el);
    });
    let chk={lines:[],dr:0,cr:0,diff:0,ok:false};
    if(o.journal){ try{ chk=Ledger.check(o.journal(v)||[]); }catch(e){} }
    if(o.journal) frag.appendChild(slip(chk, o.note?o.note(v):""));
    else if(o.note){ const n=o.note(v);
      if(n) frag.appendChild(h('<div class="slip full"><b>'+esc(t("Effect of this change"))+'</b><div class="slipnote">'+n+'</div></div>')); }
    return {frag,chk};
  }
  function redraw(){
    const active=document.activeElement, id=active&&active.id, pos=active&&active.selectionStart;
    const {frag,chk}=render();
    clear(container); container.appendChild(frag);
    const save=$("#saveBtn"); if(save&&o.journal) save.disabled=!chk.ok;
    if(id){ const el=document.getElementById(id); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  }
  container=document.createElement("div");
  container.style.display="contents";
  const {frag,chk}=render(); container.appendChild(frag);
  const m=modal({title:o.title,wide:o.wide,body:container,buttons:[
    {label:"Cancel",fn:closeModal},
    {label:o.saveLabel||"Post entry",pri:true,fn:()=>{
      try{
        if(o.journal) formDocJournal.lines = Ledger.check(o.journal(v)||[]).lines;
        o.save(v); closeModal();
      }catch(e){ toast(e.message); }
    }}
  ]});
  const save=m.querySelectorAll("footer .btn")[1]; save.id="saveBtn";
  if(o.journal) save.disabled=!chk.ok;
  return m;
}

/* project overrun: red flag once the end date is more than one day past */
function projFlag(p){
  const over = daysBetween(p.end,today());
  const done = p.status==="Completed"||p.status==="Closed";
  return {over, late: !done && over>1, done};
}

/* Multi-line editor used by invoices, purchases and manual journals.
   f: {n,label,cols:[{n,type,options,w,num,readonly,calc}],newRow(),full} */
function lineEditor(f,v,redraw){
  const rows=v[f.n];
  const box=h('<div class="slip full"><b>'+esc(t(f.label))+'</b><div class="scroll"><table><thead><tr></tr></thead><tbody></tbody></table></div></div>');
  const hr=box.querySelector("thead tr");
  f.cols.forEach(c=>hr.appendChild(h('<th'+(c.num?' class="num"':'')+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(t(c.h))+'</th>')));
  hr.appendChild(h('<th style="width:34px"></th>'));
  const tb=box.querySelector("tbody");
  rows.forEach((row,i)=>{
    const tr=document.createElement("tr");
    f.cols.forEach(c=>{
      const td=document.createElement("td");
      if(c.num) td.className="num";
      if(c.calc){ td.innerHTML='<span class="code">'+money(c.calc(row))+'</span>'; tr.appendChild(td); return; }
      let ctl;
      if(c.type==="select"){
        ctl=document.createElement("select");
        (typeof c.options==="function"?c.options(row):c.options).forEach(o=>{
          const val=(typeof o==="object")?o.v:o, lab=(typeof o==="object")?o.l:o;
          const op=document.createElement("option"); op.value=val; op.textContent=lab;
          if(String(row[c.n])===String(val)) op.selected=true; ctl.appendChild(op);
        });
      } else {
        ctl=document.createElement("input"); ctl.type=c.type||"text";
        if(c.type==="number") ctl.step=c.step||"0.01";
        ctl.value=row[c.n]==null?"":row[c.n];
      }
      ctl.className="inp"; ctl.style.padding="4px 6px";
      if(c.num) ctl.style.textAlign="right";
      ctl.id="ln_"+f.n+"_"+i+"_"+c.n;
      const upd=()=>{ row[c.n]=ctl.value; if(c.after) c.after(row); redraw(); };
      ctl.onchange=upd; ctl.oninput=()=>{ row[c.n]=ctl.value; if(c.after) c.after(row); if(c.type==="number") redraw(); };
      td.appendChild(ctl); tr.appendChild(td);
    });
    const x=h('<td><button class="btn sm" title="'+esc(t("Remove line"))+'">&minus;</button></td>');
    x.querySelector("button").onclick=()=>{ rows.splice(i,1); if(!rows.length) rows.push(f.newRow()); redraw(); };
    tr.appendChild(x); tb.appendChild(tr);
  });
  const add=h('<div class="slipnote"><button class="btn sm">+ '+esc(t("Add line"))+'</button></div>');
  add.querySelector("button").onclick=()=>{ rows.push(f.newRow()); redraw(); };
  box.appendChild(add);
  return box;
}

function agingCard(kind){
  const docs=openDocs(kind).filter(d=>d.open>0.005);
  const parties={};
  docs.forEach(d=>{
    const days=daysBetween(d.due,today());
    const b=days<=0?0:days<=30?1:days<=60?2:days<=90?3:4;
    const p=parties[d.party]=parties[d.party]||{party:d.party,b:[0,0,0,0,0],tot:0};
    p.b[b]=R2(p.b[b]+d.open); p.tot=R2(p.tot+d.open);
  });
  const rows=Object.values(parties);
  const tot=[0,1,2,3,4].map(i=>R2(rows.reduce((s,r)=>s+r.b[i],0)));
  const el=table([
    {h:kind==="SI"?"Customer":"Supplier",r:r=>esc(kind==="SI"?custName(r.party):suppName(r.party))},
    {h:"Not yet due",num:1,r:r=>r.b[0]?money(r.b[0]):"—"},
    {h:"1 – 30 days",num:1,r:r=>r.b[1]?money(r.b[1]):"—"},
    {h:"31 – 60 days",num:1,r:r=>r.b[2]?money(r.b[2]):"—"},
    {h:"61 – 90 days",num:1,cls:()=>"neg",r:r=>r.b[3]?money(r.b[3]):"—"},
    {h:"Over 90 days",num:1,cls:()=>"neg",r:r=>r.b[4]?money(r.b[4]):"—"},
    {h:"Total",num:1,r:r=>'<b>'+money(r.tot)+'</b>'}
  ],rows,{emptyTitle:"Nothing outstanding",emptyBody:"Every document in this ledger is settled."});
  const tb=el.querySelector&&el.querySelector("tbody");
  if(tb) tb.appendChild(h('<tr class="tot" style="font-weight:700;border-top:1px solid var(--ink)"><td>Total</td>'+
    tot.map(t=>'<td class="num">'+money(t)+'</td>').join("")+'<td class="num">'+money(R2(tot.reduce((a,b)=>a+b,0)))+'</td></tr>'));
  return card(kind==="SI"?"Receivables ageing":"Payables ageing",el);
}


/* ---------------- advance payments ------------------------
   Both sides derive entirely from the ledger: money given is on the
   natural side of the control account, money recovered is the contra
   side. Nothing about an advance is stored outside the journal.      */
function advanceRows(kind){
  const code=tagCode(kind==="cust"?"cust_adv":"supp_adv"), map={};
  Ledger.entries({}).forEach(j=>j.lines.forEach(l=>{
    if(l.account!==code) return;
    const k=(l.party||"—")+"|"+(l.project||"");
    const r=map[k]=map[k]||{party:l.party,project:l.project,given:0,recovered:0,last:j.date};
    if(kind==="cust"){ r.given=R2(r.given+l.cr); r.recovered=R2(r.recovered+l.dr); }
    else            { r.given=R2(r.given+l.dr); r.recovered=R2(r.recovered+l.cr); }
    if(j.date>r.last) r.last=j.date;
  }));
  return Object.values(map).map(r=>Object.assign(r,{open:R2(r.given-r.recovered)}))
    .sort((a,b)=>b.open-a.open);
}
/* how much of a supplier advance is still available to set against an invoice */
function advanceOpen(kind,party,project){
  const r=advanceRows(kind).find(x=>x.party===party&&(x.project||"")===(project||""));
  return r?r.open:0;
}

    {h:"Last movement",r:r=>fmtDate(r.last)}
  ],rows,{emptyTitle:"No advances recorded",
    emptyBody:kind==="cust"?"Record an advance when the client releases the down payment against the guarantee."
                           :"Record an advance when you pay a supplier or subcontractor up front."});
  const tb=el.querySelector&&el.querySelector("tbody");
  if(tb) tb.appendChild(h('<tr style="font-weight:700;border-top:1px solid var(--ink)"><td colspan="2">'+esc(t("Total"))+'</td>'+

    '<td class="num">'+money(R2(rows.reduce((s,r)=>s+r.open,0)))+'</td><td colspan="2"></td></tr>'));

        {n:"amt",label:"Advance amount (QR)",type:"number",syncOn:"project",
         value:proj&&proj.advance?proj.advance:(proj?R2(proj.value*0.1):0)},
        {n:"ref",label:"Guarantee reference",value:"",hint:"Advance payment guarantee number"},
        {n:"expiry",label:"Guarantee expiry",type:"date",value:proj?proj.end:today()},
        {n:"memo",label:"Narration",full:true,value:""}
      ];
    },
    journal:v=>[
      {account:v.into,dr:R2(v.amt),cr:0,party:v.party,project:v.project,memo:"Advance received"},
      {account:tagCode("cust_adv"),dr:0,cr:R2(v.amt),party:v.party,project:v.project,
       memo:"Advance from "+custName(v.party)+(v.ref?" · "+v.ref:"")}
    ],
    note:v=>{
      const p=DB.projects.find(x=>x.id===v.project);
      let out=tp("advOnCert");
      if(p&&p.value) out=tp("advPct",Math.round(R2(v.amt)/p.value*1000)/10,qr(p.value))+"<br>"+out;
      return out;
    },
    save:v=>{ guardPost();
      if(R2(v.amt)<=0) throw new Error("Enter an amount greater than zero.");
      const no=nextNo("RV"), p=DB.projects.find(x=>x.id===v.project);
      Ledger.post({no,date:v.date,source:"Advance Received",project:v.project,
        memo:v.memo||("Advance received from "+custName(v.party)+" — "+projCode(v.project)+(v.ref?" · "+v.ref:"")),
        lines:formDocJournal.lines,doc:{no,party:v.party,into:v.into,mode:"Advance",ref:v.ref}});
      if(p){ p.advance=R2((p.advance||0)); p.advanceGuarantee={ref:v.ref,expiry:v.expiry}; }
      commit("Saved");

    ],

function salesForm(){
  const c0=DB.customers[0]||{};
  formDoc({title:"New sales document",wide:true,saveLabel:"Post invoice",
    fields:v=>{
      const isC=v.type==="Contract certificate", isS=v.type==="Service invoice";
      const f=[
        {n:"type",label:"Document type",type:"select",options:["Trading invoice","Contract certificate","Service invoice"],value:"Trading invoice"},
        {n:"party",label:"Customer",type:"select",options:DB.customers.map(c=>({v:c.id,l:c.name})),value:c0.id},
        {n:"date",label:"Document date",type:"date",value:today()},
        {n:"project",label:"Project / contract",type:"select",options:projOptions(!isC),value:isC?(DB.projects[0]||{}).id:""}
      ];
      if(isC){
        f.push({n:"gross",label:"Work certified this period (QR)",type:"number",value:0});
        f.push({n:"retpct",label:"Retention withheld %",type:"number",step:"0.5",syncOn:"project",
          value:(DB.projects.find(p=>p.id===v.project)||{}).retention!=null?(DB.projects.find(p=>p.id===v.project)||{}).retention:DB.settings.retentionPct});
        f.push({n:"advrec",label:"Advance recovered (QR)",type:"number",syncOn:"project",value:0,
          hint:"Set against the advance received from this client"});
      } else {
        f.push({n:"lines",label:isS?"Services billed":"Goods sold",type:"lines",full:true,syncOn:"type",
          newRow:()=>({item:(DB.items[0]||{}).id,qty:1,rate:(DB.items[0]||{}).price||0,desc:""}),
          cols:isS?[
            {h:"Description",n:"desc",w:"52%"},
            {h:"Qty",n:"qty",type:"number",num:1,w:"90px"},
            {h:"Rate",n:"rate",type:"number",num:1,w:"110px"},
            {h:"Amount",num:1,calc:r=>R2((+r.qty||0)*(+r.rate||0))}
          ]:[
            {h:"Stock item",n:"item",type:"select",w:"46%",options:DB.items.map(i=>({v:i.id,l:i.code+" · "+i.name})),
             after:r=>{const it=DB.items.find(x=>x.id===r.item); if(it) r.rate=it.price;}},
            {h:"Qty",n:"qty",type:"number",num:1,w:"90px"},
            {h:"Rate",n:"rate",type:"number",num:1,w:"110px"},
            {h:"Amount",num:1,calc:r=>R2((+r.qty||0)*(+r.rate||0))}
          ]});
      }
      f.push({n:"memo",label:"Narration",full:true,value:""});
      return f;
    },
    journal:v=>{
      const AR=tagCode("ar"), lines=[];
      if(v.type==="Contract certificate"){
        const gross=R2(v.gross), ret=R2(gross*(+v.retpct||0)/100), adv=R2(v.advrec);
        lines.push({account:AR,dr:R2(gross-ret-adv),cr:0,party:v.party,project:v.project,memo:"Certificate net receivable"});
        if(ret) lines.push({account:tagCode("retention_rec"),dr:ret,cr:0,party:v.party,project:v.project,memo:"Retention withheld"});
        if(adv) lines.push({account:tagCode("cust_adv"),dr:adv,cr:0,party:v.party,project:v.project,memo:"Advance recovered"});
        lines.push({account:tagCode("sales_contract"),dr:0,cr:gross,project:v.project,memo:"Work certified"});
      } else {
        const rows=v.lines||[], tot=R2(rows.reduce((s,r)=>s+(+r.qty||0)*(+r.rate||0),0));
        lines.push({account:AR,dr:tot,cr:0,party:v.party,project:v.project,memo:"Invoice value"});
        lines.push({account:v.type==="Service invoice"?"4300":tagCode("sales_trading"),dr:0,cr:tot,project:v.project,memo:"Sales"});
        if(v.type==="Trading invoice"){
          const byAcct={};
          rows.forEach(r=>{ const it=DB.items.find(x=>x.id===r.item); if(!it) return;
            const c=R2((+r.qty||0)*(it.cost||0)); if(!c) return; byAcct[it.acct]=R2((byAcct[it.acct]||0)+c); });
          const cogs=R2(Object.values(byAcct).reduce((a,b)=>a+b,0));
          if(cogs){ lines.push({account:tagCode("cogs"),dr:cogs,cr:0,project:v.project,memo:"Cost of goods sold"});
            Object.keys(byAcct).forEach(a=>lines.push({account:a,dr:0,cr:byAcct[a],memo:"Stock relieved"})); }
        }
      }
      return lines;
    },
    note:v=>{
      if(v.type==="Contract certificate"){
        const avail=advanceOpen("cust",v.party,v.project), rec=R2(v.advrec);
        let out=tp("advAvailCust",qr(avail));
        if(rec>avail+0.004) out+='<br><span style="color:var(--maroon)">'+esc(tp("advOverRec",qr(avail)))+'</span>';
        else if(rec>0) out+="<br>"+esc(tp("advRecovers",qr(rec),qr(avail),qr(R2(avail-rec))));
        return out;
      }
      if(v.type!=="Trading invoice") return "";
      const short=(v.lines||[]).filter(r=>{const it=DB.items.find(x=>x.id===r.item); return it&&(+r.qty||0)>it.qty;});
      return short.length?'<span style="color:var(--maroon)">Stock shortfall: '+short.map(r=>esc((DB.items.find(x=>x.id===r.item)||{}).code)).join(", ")+' will go negative.</span>'
        :"Cost of sales is taken at weighted-average cost and stock is relieved on posting.";
    },
    save:v=>{
      guardPost();
      const cust=DB.customers.find(c=>c.id===v.party); if(!cust) throw new Error("Select a customer.");
      if(v.type==="Contract certificate" && R2(v.advrec)>advanceOpen("cust",v.party,v.project)+0.004)
        throw new Error(t("Advance recovered (QR)")+" > "+t("Outstanding"));
      const no=nextNo("SI"), due=addDays(v.date,cust.terms||0);
      let gross,ret,receivable;
      if(v.type==="Contract certificate"){
        gross=R2(v.gross); ret=R2(gross*(+v.retpct||0)/100); receivable=R2(gross-ret-R2(v.advrec));
      } else {
        gross=R2((v.lines||[]).reduce((s,r)=>s+(+r.qty||0)*(+r.rate||0),0)); ret=0; receivable=gross;
      }
      const j=Ledger.post({no,date:v.date,source:"Sales Invoice",project:v.project,
        memo:v.memo||(v.type+" to "+cust.name),
        lines:formDocJournal.lines,
        doc:{no,date:v.date,due,party:v.party,type:v.type,project:v.project,gross,retention:ret,
             advance:v.type==="Contract certificate"?R2(v.advrec):0,receivable,
             lines:(v.lines||[]).map(r=>({item:r.item,desc:r.desc,qty:+r.qty||0,rate:+r.rate||0}))}});
      if(v.type==="Trading invoice") (v.lines||[]).forEach(r=>moveStock(r.item,-(+r.qty||0),0,"Sale "+no,v.date,v.project));
      commit("Invoice "+no+" posted");
    }});
}
const addDays=(iso,n)=>{ const d=dnum(iso); d.setDate(d.getDate()+(+n||0)); return d.toISOString().slice(0,10); };

function purchaseForm(){
  formDoc({title:"New purchase invoice",wide:true,saveLabel:"Post invoice",
    fields:v=>{
      const ty=v.type||"Goods for stock", sub=ty==="Subcontractor certificate";
      const f=[
        {n:"type",label:"Invoice type",type:"select",options:["Goods for stock","Direct project cost","Subcontractor certificate","Overhead expense"],value:"Goods for stock"},
        {n:"party",label:"Supplier",type:"select",options:DB.suppliers.map(s=>({v:s.id,l:s.name})),value:(DB.suppliers[0]||{}).id},
        {n:"date",label:"Invoice date",type:"date",value:today()},
        {n:"ref",label:"Supplier invoice no.",value:""}
      ];
      if(ty!=="Goods for stock") f.push({n:"project",label:"Project / contract",type:"select",options:projOptions(ty==="Overhead expense"),value:ty==="Overhead expense"?"":(DB.projects[0]||{}).id});
      if(sub){
        f.push({n:"gross",label:"Value certified (QR)",type:"number",value:0});
        f.push({n:"retpct",label:"Retention withheld %",type:"number",step:"0.5",value:DB.settings.retentionPct});
      }
      if(ty!=="Overhead expense"){
        f.push({n:"advrec",label:"Advance recovered (QR)",type:"number",syncOn:"party",value:0,
          hint:"Set against the advance already paid to this supplier"});
      }
      if(ty==="Goods for stock"){
        f.push({n:"lines",label:"Goods received",type:"lines",full:true,syncOn:"type",
          newRow:()=>({item:(DB.items[0]||{}).id,qty:1,rate:0}),
          cols:[
            {h:"Stock item",n:"item",type:"select",w:"46%",options:DB.items.map(i=>({v:i.id,l:i.code+" · "+i.name}))},
            {h:"Qty received",n:"qty",type:"number",num:1,w:"110px"},
            {h:"Unit cost",n:"rate",type:"number",num:1,w:"110px"},
            {h:"Value",num:1,calc:r=>R2((+r.qty||0)*(+r.rate||0))}
          ]});
      } else {
        f.push({n:"lines",label:"Cost breakdown",type:"lines",full:true,syncOn:"type",
          newRow:()=>({acct:ty==="Overhead expense"?"6900":"5210",desc:"",amt:0}),
          cols:[
            {h:"Account",n:"acct",type:"select",w:"46%",
             options:acctOptions(a=>ty==="Overhead expense"?a.type==="EXPENSE":(a.type==="COS"||a.type==="EXPENSE"))},
            {h:"Description",n:"desc",w:"30%"},
            {h:"Amount",n:"amt",type:"number",num:1,w:"120px"}
          ]});
      }
      f.push({n:"memo",label:"Narration",full:true,value:""});
      return f;
    },
    journal:v=>{
      const AP=tagCode("ap"), ty=v.type||"Goods for stock", L=[];
      const adv=ty==="Overhead expense"?0:R2(v.advrec);
      if(ty==="Subcontractor certificate"){
        const g=R2(v.gross), ret=R2(g*(+v.retpct||0)/100);
        L.push({account:"5200",dr:g,cr:0,project:v.project,memo:"Subcontract works certified"});
        L.push({account:AP,dr:0,cr:R2(g-ret-adv),party:v.party,project:v.project,memo:"Payable to subcontractor"});
        if(ret) L.push({account:tagCode("retention_pay"),dr:0,cr:ret,party:v.party,project:v.project,memo:"Retention withheld"});
      } else if(ty==="Goods for stock"){
        const rows=v.lines||[], byAcct={};
        rows.forEach(r=>{ const it=DB.items.find(x=>x.id===r.item); if(!it) return;
          const val=R2((+r.qty||0)*(+r.rate||0)); if(!val) return; byAcct[it.acct]=R2((byAcct[it.acct]||0)+val); });
        const tot=R2(Object.values(byAcct).reduce((a,b)=>a+b,0));
        Object.keys(byAcct).forEach(a=>L.push({account:a,dr:byAcct[a],cr:0,memo:"Goods received into store"}));
        L.push({account:AP,dr:0,cr:R2(tot-adv),party:v.party,memo:"Supplier invoice"});
      } else {
        const rows=v.lines||[], tot=R2(rows.reduce((s,r)=>s+(+r.amt||0),0));
        rows.forEach(r=>{ if(+r.amt) L.push({account:r.acct,dr:R2(r.amt),cr:0,project:v.project,memo:r.desc||""}); });
        L.push({account:AP,dr:0,cr:R2(tot-adv),party:v.party,project:v.project,memo:"Supplier invoice"});
      }
      if(adv) L.push({account:tagCode("supp_adv"),dr:0,cr:adv,party:v.party,project:v.project,memo:"Advance recovered"});
      return L;
    },
    note:v=>{
      const ty=v.type||"Goods for stock";
      let out = ty==="Goods for stock"?"Receipts update the weighted-average cost of each item on posting."
        : ty==="Subcontractor certificate"?"Retention is held in 2115 until the defects liability period ends.":"";
      if(ty!=="Overhead expense"){
        const avail=advanceOpen("supp",v.party,v.project), rec=R2(v.advrec);
        if(out) out+="<br>";
        out += tp("advAvail",qr(avail));
        if(rec>avail+0.004) out+='<br><span style="color:var(--maroon)">'+esc(tp("advOverRec",qr(avail)))+'</span>';
        else if(rec>0) out+="<br>"+esc(tp("advRecovers",qr(rec),qr(avail),qr(R2(avail-rec))));
      }
      return out;
    },
    save:v=>{
      guardPost();
      const sup=DB.suppliers.find(s=>s.id===v.party); if(!sup) throw new Error("Select a supplier.");
      const no=nextNo("PI"), due=addDays(v.date,sup.terms||0), ty=v.type||"Goods for stock";
      let gross=0,ret=0;
      const adv=ty==="Overhead expense"?0:R2(v.advrec);
      if(ty==="Subcontractor certificate"){ gross=R2(v.gross); ret=R2(gross*(+v.retpct||0)/100); }
      else if(ty==="Goods for stock") gross=R2((v.lines||[]).reduce((s,r)=>s+(+r.qty||0)*(+r.rate||0),0));
      else gross=R2((v.lines||[]).reduce((s,r)=>s+(+r.amt||0),0));
      if(adv>advanceOpen("supp",v.party,v.project)+0.004) throw new Error(t("Advance recovered (QR)")+" > "+t("Outstanding"));
      Ledger.post({no,date:v.date,source:"Purchase Invoice",project:v.project,
        memo:v.memo||(ty+" — "+sup.name),lines:formDocJournal.lines,
        doc:{no,date:v.date,due,party:v.party,type:ty,ref:v.ref,project:v.project||"",gross,retention:ret,advance:adv,receivable:R2(gross-ret-adv)}});
      if(ty==="Goods for stock") (v.lines||[]).forEach(r=>moveStock(r.item,+r.qty||0,+r.rate||0,"GRN "+no,v.date,""));
      commit("Purchase invoice "+no+" posted");
    }});
}

/* ---------- stock: weighted average cost ------------------- */
function moveStock(itemId,qty,unitCost,ref,date,project){
  const it=DB.items.find(i=>i.id===itemId); if(!it||!qty) return;
  const q=+qty, unit=q>0?(+unitCost||0):it.cost;
  if(it.val==null) it.val=R2(it.qty*it.cost);
  /* value moved is rounded exactly as the journal rounds it, so the item
     master and accounts 1140/1141 can never drift apart */
  const value=R2(Math.abs(q)*unit);
  it.qty=R2(it.qty+q);
  it.val=R2(it.val+(q>0?value:-value));
  if(it.qty>0.00001) it.cost=it.val/it.qty;
  DB.stockMoves.push({id:"M"+Date.now()+Math.floor(Math.random()*99),date:date||today(),item:itemId,
    qty:q,cost:unit,ref:ref||"",project:project||"",balance:it.qty,wac:it.cost});
}
const stockValue = () => R2(DB.items.reduce((s,i)=>s+(i.val!=null?i.val:R2(i.qty*i.cost)),0));
const itemValue = i => R2(i.val!=null?i.val:R2(i.qty*i.cost));

function depreciationForm(){
  formDoc({title:"Monthly depreciation run",wide:true,saveLabel:"Post depreciation",
    fields:()=>[{n:"month",label:"Depreciate up to and including",type:"date",value:monthEnd(today())}],
    journal:v=>{
      const to=monthEnd(v.month), L=[]; let tot=0;
      DB.assets.forEach(a=>{
        a._charge=0;
        if(a.status==="Disposed") return;
        const from=a.deprTo?addMonths(a.deprTo,1):a.date;
        let n=0, cur=monthEnd(from);
        while(cur<=to && n<600){ if(monthEnd(a.date)<=cur) n++; cur=monthEnd(addMonths(cur,1)); }
        const cap=R2(a.cost-(+a.residual||0)-accumDep(a));
        const charge=Math.min(R2(monthlyDep(a)*n),Math.max(cap,0));
        if(charge>0.004){ a._charge=charge; tot=R2(tot+charge); }
      });
      if(!tot) return [];
      L.push({account:tagCode("depr_exp"),dr:tot,cr:0,memo:"Depreciation to "+to});
      DB.assets.filter(a=>a._charge>0.004).forEach(a=>
        L.push({account:tagCode("ad:"+a.cat),dr:0,cr:a._charge,party:a.id,memo:a.tag+" "+a.name}));
      return L;
    },
    note:()=>{
      const rows=DB.assets.filter(a=>a._charge>0.004);
      return rows.length? rows.map(a=>esc(a.tag)+" "+esc(a.name)+" — "+qr(a._charge)).join("<br>")
        : "Nothing to charge for this period. Assets are already depreciated up to date.";
    },
    save:v=>{ guardPost();
      const to=monthEnd(v.month);
      Ledger.post({date:to,source:"Depreciation",memo:"Depreciation charge to "+fmtDate(to),lines:formDocJournal.lines});
      DB.assets.forEach(a=>{ if(a._charge>0.004) a.deprTo=to; delete a._charge; });
      commit("Depreciation posted"); }});
}

function payrollForm(){
  formDoc({title:"Run monthly payroll",wide:true,saveLabel:"Post payroll",
    fields:()=>[
      {n:"month",label:"Payroll month ending",type:"date",value:monthEnd(today())},
      {n:"recover",label:"Recover staff advances",type:"select",options:[{v:"yes",l:"Yes — deduct outstanding advances"},{v:"no",l:"No"}],value:"yes"}
    ],
    journal:v=>{
      const L=[], staff=DB.employees.filter(e=>e.active);
      const byAcct={};
      staff.forEach(e=>{
        const gross=R2(e.basic+e.allow);
        const a=e.project?tagCode("direct_labour"):tagCode("salary_exp");
        byAcct[a+"|"+(e.project||"")]=R2((byAcct[a+"|"+(e.project||"")]||0)+gross);
      });
      Object.keys(byAcct).forEach(k=>{ const [a,p]=k.split("|");
        L.push({account:a,dr:byAcct[k],cr:0,project:p,memo:"Payroll "+fmtDate(monthEnd(v.month))}); });
      let adv=0;
      if(v.recover==="yes") staff.forEach(e=>{ const d=empAdvance(e); if(d>0){ adv=R2(adv+d);
        L.push({account:tagCode("staff_adv"),dr:0,cr:d,party:e.id,memo:"Advance recovered — "+e.name}); } });
      const gross=R2(staff.reduce((s,e)=>s+e.basic+e.allow,0));
      L.push({account:tagCode("payroll_pay"),dr:0,cr:R2(gross-adv),memo:"Net salaries payable"});
      return L;
    },
    note:v=>{
      const staff=DB.employees.filter(e=>e.active);
      const gross=R2(staff.reduce((s,e)=>s+e.basic+e.allow,0));
      const adv=v.recover==="yes"?R2(staff.reduce((s,e)=>s+Math.max(empAdvance(e),0),0)):0;
      return staff.length+" employees · gross "+qr(gross)+" · advances recovered "+qr(adv)+" · net payable "+qr(R2(gross-adv))+
        "<br>Salaries for project staff are charged to 5220 Direct Labour so they land in project cost.";
    },
    save:v=>{ guardPost();
      const no=nextNo("JV");
      Ledger.post({no,date:monthEnd(v.month),source:"Payroll",memo:"Payroll for month ending "+fmtDate(monthEnd(v.month)),lines:formDocJournal.lines});
      commit("Payroll posted"); }});
}

/* ==================== PROJECTS ============================= */
const projRevenue = id => R2(Ledger.typeTotal("REVENUE",{project:id}));
const projCost = id => R2(Ledger.typeTotal("COS",{project:id})+Ledger.typeTotal("EXPENSE",{project:id}));
const projMargin = id => R2(projRevenue(id)-projCost(id));

view("projects",{label:"Projects & Contracts",code:"4200",group:"Contracts",render(m){
  if(TAB.proj==="detail"&&TAB.projId) return projectDetail(m,DB.projects.find(p=>p.id===TAB.projId));
  m.appendChild(page("Contract & Project Management","Schedule, certified income and direct cost by contract. A contract is flagged red once its end date is more than one day past.",[
    {label:"New project",pri:true,fn:()=>projectForm()}]));

  /* four ways in: everything, what is running, what has slipped, what is finished */
  const counts={all:DB.projects.length,
    run:DB.projects.filter(p=>!projFlag(p).done&&!projFlag(p).late).length,
    late:lateProjects().length,
    done:DB.projects.filter(p=>projFlag(p).done).length};
  const fil=TAB.pfil||"all";
  const bar=h('<div class="tabs"></div>');
  [["all","All",counts.all],["run","Running",counts.run],["late","Overdue",counts.late],["done","Completed",counts.done]].forEach(([k,l,n])=>{
    const b=h('<button class="tab'+(fil===k?" on":"")+(k==="late"&&n?' style="color:var(--maroon)"':"")+'">'+esc(t(l))+' <span class="code">'+n+'</span></button>');
    b.onclick=()=>{TAB.pfil=k;draw();}; bar.appendChild(b);
  });
  m.appendChild(bar);

  const rows=DB.projects.filter(p=>{const f=projFlag(p);
    return fil==="all"||(fil==="late"&&f.late)||(fil==="done"&&f.done)||(fil==="run"&&!f.done&&!f.late);});

  const late=lateProjects();
  if(late.length&&fil!=="done") m.appendChild(h('<div class="card" style="border-color:var(--maroon);background:var(--maroon-soft);margin-bottom:14px"><div class="body"><b style="color:var(--maroon)"><span class="flagdot"></span>'+esc(tp("projOverdue",late.length))+'</b><br><span style="color:var(--ink-soft)">'+late.map(p=>esc(p.code)+" — "+esc(p.name)+" · "+esc(tp("daysOverdue",projFlag(p).over))+" ("+esc(t("Contract end date"))+" "+fmtDate(p.end)+")").join("<br>")+'</span></div></div>'));

  m.appendChild(card("Contract register",table([
    {h:"",w:"18px",r:p=>projFlag(p).late?'<span class="flagdot"></span>':""},
    {h:"Code",r:p=>'<span class="code">'+esc(p.code)+'</span>'},
    {h:"Project",r:p=>'<b>'+esc(p.name)+'</b><br><span class="code">'+esc(p.manager||"")+'</span>'},
    {h:"Client",r:p=>esc(custName(p.customer))},
    {h:"Start",r:p=>fmtDate(p.start)},
    {h:"Original end date",r:p=>fmtDate(p.baselineEnd||p.end)},
    {h:"Current end date",r:p=>{const rev=(p.revisions||[]).length;
      return fmtDate(p.end)+(rev?'<br><span class="code">'+esc(tp("extCount",rev))+'</span>':"");}},
    {h:"Days over",num:1,cls:p=>projFlag(p).late?"neg":"",r:p=>{const f=projFlag(p); return f.late?'<b>'+f.over+'</b>':(f.done?"—":(f.over>=0?"0":f.over));}},
    {h:"Schedule",r:p=>{const f=projFlag(p);
      return f.late?'<span class="tag red">'+esc(tp("daysOverdue",f.over))+'</span>'
        :f.done?'<span class="tag green">'+esc(t(p.status))+'</span>'
        :'<span class="tag">'+esc(tp("daysLeft",Math.max(-f.over,0)))+'</span>';}},
    {h:"Contract value",num:1,r:p=>money(p.value)},
    {h:"Certified",num:1,r:p=>money(projRevenue(p.id))},
    {h:"Cost",num:1,r:p=>money(projCost(p.id))},
    {h:"Margin",num:1,cls:p=>projMargin(p.id)<0?"neg":"pos",r:p=>'<b>'+money(projMargin(p.id))+'</b>'},
    {h:"%",num:1,r:p=>projRevenue(p.id)?Math.round(projMargin(p.id)/projRevenue(p.id)*100)+"%":"—"}
  ],rows,{onRow:p=>{TAB.proj="detail";TAB.projId=p.id;draw();},
    emptyTitle:fil==="late"?"No overdue projects":"No projects registered",
    emptyBody:fil==="late"?"":"Add a contract to start tracking income, cost and schedule."})));
}});

function projectDetail(m,p){
  if(!p){ TAB.proj=""; return draw(); }
  const f=projFlag(p), rev=projRevenue(p.id), cost=projCost(p.id), marg=R2(rev-cost);
  const pct=p.value?Math.min(Math.round(rev/p.value*100),999):0;
  const base=p.baselineEnd||p.end, slip=daysBetween(base,p.end);
  m.appendChild(page(p.code+" — "+p.name,esc(p.scope||""),[
    {label:"Back to register",fn:()=>{TAB.proj="";draw();}},
    {label:"Revise end date",fn:()=>reviseForm(p)},
    {label:"Edit project",fn:()=>projectForm(p)},
    {label:"Raise certificate",pri:true,fn:()=>salesForm()}]));
  if(f.late) m.appendChild(h('<div class="card" style="border-color:var(--maroon);background:var(--maroon-soft);margin-bottom:14px"><div class="body"><b style="color:var(--maroon)"><span class="flagdot"></span>'+esc(tp("overdueBy",f.over))+'</b> '+esc(t("Contract end date"))+': '+fmtDate(p.end)+'</div></div>'));
  const g=h('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>');
  g.appendChild(stat("Contract value",money(p.value),esc(custName(p.customer))));
  g.appendChild(stat("Certified to date",money(rev),tp("certifiedPct",pct)));
  g.appendChild(stat("Cost",money(cost)));
  g.appendChild(stat("Margin",money(marg),rev?tp("ofCertified",Math.round(marg/rev*100)):"",marg<0?"neg":"pos"));
  g.appendChild(stat("Retention held",money(Ledger.show(tagCode("retention_rec"),{project:p.id}))));
  g.appendChild(stat("Advance outstanding",money(Ledger.show(tagCode("cust_adv"),{project:p.id}))));
  g.appendChild(stat("Supplier advance outstanding",money(Ledger.show(tagCode("supp_adv"),{project:p.id}))));
  m.appendChild(g);
  m.appendChild(h('<div style="height:14px"></div>'));

  /* ---- schedule: baseline, revisions, current, slip ---- */
  const sc=h('<div class="card"><header><h3>'+esc(t("Schedule & delivery"))+'</h3><div class="r"></div></header><div class="body"></div></div>');
  const body=sc.querySelector(".body");
  body.appendChild(h('<div class="scroll"><table>'+
    '<tr><td>'+esc(t("Start date"))+'</td><td class="num">'+fmtDate(p.start)+'</td></tr>'+
    '<tr><td>'+esc(t("Original end date"))+' <span class="code">('+esc(t("Baseline"))+')</span></td><td class="num">'+fmtDate(base)+'</td></tr>'+
    '<tr><td>'+esc(t("Current end date"))+'</td><td class="num"><b>'+fmtDate(p.end)+'</b></td></tr>'+
    (slip?'<tr><td>'+esc(t("Slip"))+'</td><td class="num neg">'+esc(tp("slipDays",slip))+'</td></tr>':"")+
    '<tr><td>'+esc(t("Status"))+'</td><td class="num">'+(f.late?'<span class="tag red">'+esc(tp("daysOverdue",f.over))+'</span>':f.done?'<span class="tag green">'+esc(t(p.status))+'</span>':'<span class="tag">'+esc(t(p.status))+'</span>')+'</td></tr>'+
    '<tr><td>'+esc(t("Project manager"))+'</td><td class="num">'+esc(p.manager||"—")+'</td></tr>'+
    '</table></div>'));
  body.appendChild(h('<div class="progress" style="margin-top:12px"><i class="'+(f.late?"over":"")+'" style="width:'+Math.min(pct,100)+'%"></i></div>'));
  body.appendChild(h('<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:5px"><span>'+fmtDate(p.start)+'</span><span>'+esc(tp("certifiedPct",pct))+'</span><span>'+fmtDate(p.end)+'</span></div>'));
  m.appendChild(sc);
  m.appendChild(h('<div style="height:12px"></div>'));

  m.appendChild(card("Revision history",table([
    {h:"Logged",r:r=>fmtDate(r.on)},
    {h:"From",r:r=>fmtDate(r.from)},
    {h:"To",r:r=>fmtDate(r.to)},
    {h:"Days",num:1,cls:r=>daysBetween(r.from,r.to)>0?"neg":"pos",r:r=>{const d=daysBetween(r.from,r.to);return (d>0?"+":"")+d;}},
    {h:"Reason",r:r=>esc(r.reason||"")},
    {h:"Approved by",r:r=>esc(r.by||"")}
  ],(p.revisions||[]).slice().reverse(),
    {emptyTitle:"No revisions logged",emptyBody:"The end date has never been moved from the original contract date."})));
  m.appendChild(h('<div style="height:12px"></div>'));

  const costRows=postable().filter(a=>(a.type==="COS"||a.type==="EXPENSE")&&Ledger.show(a.code,{project:p.id}));
  m.appendChild(card("Cost breakdown",table([
    {h:"Account",r:a=>'<span class="code">'+esc(a.code)+'</span> '+esc(acctName(a.code))},
    {h:"Amount",num:1,r:a=>money(Ledger.show(a.code,{project:p.id}))},
    {h:"% of cost",num:1,r:a=>cost?Math.round(Ledger.show(a.code,{project:p.id})/cost*100)+"%":"—"}
  ],costRows,{emptyTitle:"No costs charged yet",emptyBody:"Purchase invoices and payroll charged to this project appear here."})));
  m.appendChild(h('<div style="height:12px"></div>'));
  const entries=Ledger.entries({project:p.id});
  m.appendChild(card("Project transactions",table([
    {h:"Date",r:j=>fmtDate(j.date)},{h:"Voucher",r:j=>'<span class="code">'+esc(j.no)+'</span>'},
    {h:"Source",r:j=>'<span class="tag">'+esc(t(j.source))+'</span>'},
    {h:"Narration",r:j=>esc(j.memo)},
    {h:"Value",num:1,r:j=>money(R2(j.lines.filter(l=>l.project===p.id).reduce((s,l)=>s+Math.max(l.dr,l.cr),0)))}
  ],entries.reverse(),{onRow:j=>showEntry(j),emptyTitle:"Nothing posted to this project"})));
}

/* Moving a contract end date is a tracked event, never a silent edit. */
function reviseForm(p){
  formDoc({title:"Revise the end date",wide:true,saveLabel:"Log revision",
    fields:()=>[
      {n:"end",label:"New end date",type:"date",value:p.end},
      {n:"on",label:"Logged",type:"date",value:today()},
      {n:"reason",label:"Reason for revision",type:"select",
       options:["Client-approved extension of time","Variation order issued","Access to site delayed",
                "Material delivery delay","Weather / force majeure","Internal re-plan","Correcting a data entry error"],
       value:"Client-approved extension of time"},
      {n:"by",label:"Approved by",value:(DB.users.find(u=>u.id===DB.currentUser)||{}).name||""},
      {n:"note",label:"Notes",type:"textarea",full:true,value:""}
    ],
    note:v=>{
      const base=p.baselineEnd||p.end, d=daysBetween(base,v.end), over=daysBetween(v.end,today());
      let out=esc(t("Original end date"))+": "+fmtDate(base)+" · "+esc(t("Slip"))+": "+(d>0?"+":"")+d+" "+esc(t("Days over")).toLowerCase()+".";
      if(over>1) out+='<br><span style="color:var(--maroon)">'+esc(tp("overdueBy",over))+" "+esc(t("Overdue"))+'</span>';
      return out;
    },
    save:v=>{
      if(v.end===p.end) throw new Error(t("New end date")+" = "+t("Current end date"));
      p.baselineEnd=p.baselineEnd||p.end;
      p.revisions=p.revisions||[];
      p.revisions.push({on:v.on,from:p.end,to:v.end,reason:v.reason+(v.note?" — "+v.note:""),by:v.by});
      p.end=v.end;
      commit("Saved");
    }});
}

      {n:"start",label:"Start date",type:"date",value:p?p.start:today()},
      {n:"end",label:"Contract end date",type:"date",value:p?p.end:addDays(today(),180)},
      {n:"value",label:"Contract value (QR)",type:"number",value:p?p.value:0},
      {n:"retention",label:"Retention %",type:"number",step:"0.5",value:p?p.retention:DB.settings.retentionPct},
      {n:"manager",label:"Project manager",value:p?p.manager:""},
      {n:"location",label:"Site location",value:p?p.location:""},
      {n:"status",label:"Status",type:"select",options:["Not started","In Progress","On Hold","Completed","Closed"],value:p?p.status:"In Progress"},
      {n:"scope",label:"Scope of works",type:"textarea",full:true,value:p?p.scope:""}
    ],
    note:v=>{
      const over=daysBetween(v.end,today());
      if(v.status==="Completed"||v.status==="Closed") return t("Completed")+" / "+t("Closed")+": "+(isAR()?"مستبعد من إشارة التأخير.":"excluded from the overdue flag.");
      if(p && v.end!==p.end) return '<span style="color:var(--amber)">'+(isAR()?"استخدم «تعديل تاريخ الانتهاء» ليُسجَّل التغيير في سجل التعديلات.":"Use “Revise end date” instead so the change is written to the revision history.")+'</span>';
      return over>1?'<span style="color:var(--maroon)">'+esc(tp("overdueBy",over))+'</span>'
        :over>=0?(isAR()?"ينتهي اليوم. تظهر الإشارة الحمراء بعد تجاوز التاريخ بأكثر من يوم واحد.":"Ends today. The red flag is raised once the end date is more than one day past.")
        :esc(tp("daysLeft",-over));
    },
    save:v=>{
      if(!v.name.trim()) throw new Error("Enter a project name.");
      const rec={code:v.code,name:v.name,customer:v.customer,start:v.start,end:v.end,value:+v.value||0,
        retention:+v.retention||0,manager:v.manager,location:v.location,status:v.status,scope:v.scope};
      if(p){ if(v.end!==p.end){ p.baselineEnd=p.baselineEnd||p.end; (p.revisions=p.revisions||[]).push(
          {on:today(),from:p.end,to:v.end,reason:"Edited on the project form",by:(DB.users.find(u=>u.id===DB.currentUser)||{}).name||""}); }
        Object.assign(p,rec); }
      else DB.projects.push(Object.assign({id:"P"+String(DB.projects.length+1).padStart(3,"0"),
        baselineEnd:v.end,revisions:[],advance:0},rec));
      commit("Saved");
    }});
}

function sheet(title,period,bodyNode){
  const nm = isAR() && DB.company.nameAr ? DB.company.nameAr : DB.company.name;
  const units = isAR() ? "جميع المبالغ بالريال القطري" : "all amounts in Qatari Riyals";
  const s=h('<div class="sheet"><div class="sh"><h2>'+esc(nm)+'</h2><p>'+esc(DB.company.cr)+' · '+esc(DB.company.addr)+'</p></div>'+
    '<div style="text-align:center;margin-bottom:14px"><b style="font-family:var(--display);font-size:16px">'+esc(t(title))+'</b>'+
    '<div class="code" style="font-size:11px">'+esc(period)+' · '+esc(units)+'</div></div></div>');
  s.appendChild(bodyNode); return s;
}
function srow(label,val,cls,indent){
  return '<tr'+(cls?' class="'+cls+'"':"")+'><td'+(indent?' class="indent"':"")+'>'+label+'</td><td class="num">'+(val==null?"":money(val))+'</td></tr>';
}

function repTB(f,per){
  const rows=postable().map(a=>({a,b:Ledger.bal(a.code,f)})).filter(r=>Math.abs(r.b)>0.004);
  const dr=R2(rows.filter(r=>r.b>0).reduce((s,r)=>s+r.b,0)), cr=R2(rows.filter(r=>r.b<0).reduce((s,r)=>s-r.b,0));
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Account"))+'</th><th class="num">'+esc(t("Debit"))+'</th><th class="num">'+esc(t("Credit"))+'</th></tr></thead><tbody>';
  rows.forEach(r=>{ html+='<tr><td class="code">'+esc(r.a.code)+'</td><td>'+esc(acctName(r.a.code))+'</td><td class="num">'+
    (r.b>0?money(r.b):"")+'</td><td class="num">'+(r.b<0?money(-r.b):"")+'</td></tr>'; });
  html+='<tr class="total"><td colspan="2">'+esc(t("Total"))+'</td><td class="num">'+money(dr)+'</td><td class="num">'+money(cr)+'</td></tr>';
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  if(Math.abs(R2(dr-cr))>0.004) node.appendChild(h('<p class="neg" style="margin-top:10px">'+esc(tp("outBy",qr(R2(dr-cr))))+'</p>'));
  return sheet("Trial Balance",per,node);
}

function repPL(f,per){
  const grp=t=>postable().filter(a=>a.type===t).map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004);
  const rev=grp("REVENUE"), cos=grp("COS"), exp=grp("EXPENSE");
  const tR=R2(rev.reduce((s,r)=>s+r.v,0)), tC=R2(cos.reduce((s,r)=>s+r.v,0)), tE=R2(exp.reduce((s,r)=>s+r.v,0));
  const gp=R2(tR-tC), np=R2(gp-tE);
  let html='<table><tbody>';
  const ln=r=>srow('<span class="code">'+esc(r.a.code)+'</span> '+esc(acctName(r.a.code)),r.v,"",true);
  html+='<tr class="head"><td colspan="2">'+esc(t("Revenue"))+'</td></tr>'+rev.map(ln).join("");
  html+=srow(t("Total revenue"),tR,"sub");
  html+='<tr class="head"><td colspan="2">'+esc(t("Cost of sales and direct costs"))+'</td></tr>'+cos.map(ln).join("");
  html+=srow(t("Total direct cost"),tC,"sub");
  html+=srow("<b>"+esc(t("Gross profit"))+"</b>",gp,"sub");
  html+='<tr class="head"><td colspan="2">'+esc(t("General and administrative expenses"))+'</td></tr>'+exp.map(ln).join("");
  html+=srow(t("Total operating expenses"),tE,"sub");
  html+=srow("<b>"+esc(t("Net profit for the period"))+"</b>",np,"total");
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  if(tR) node.appendChild(h('<p style="margin-top:12px;color:var(--ink-soft);font-size:12.5px">Gross margin '+Math.round(gp/tR*100)+'% · net margin '+Math.round(np/tR*100)+'%'+(f.project?' · filtered to '+esc(projName(f.project)):"")+'</p>'));
  return sheet("Statement of Profit or Loss",per,node);
}

function repBS(to){
  const f={to};
  const pick=(pred)=>postable().filter(pred).map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004);
  const ca=pick(a=>a.type==="ASSET"&&a.code<"1200"), nca=pick(a=>a.type==="ASSET"&&a.code>="1200");
  const cl=pick(a=>a.type==="LIABILITY"&&a.code<"2200"), ncl=pick(a=>a.type==="LIABILITY"&&a.code>="2200");
  const eq=pick(a=>a.type==="EQUITY");
  const tCA=R2(ca.reduce((s,r)=>s+r.v,0)), tNCA=R2(nca.reduce((s,r)=>s+r.v,0));
  const tCL=R2(cl.reduce((s,r)=>s+r.v,0)), tNCL=R2(ncl.reduce((s,r)=>s+r.v,0));
  const np=Ledger.netProfit(f), tEQ=R2(eq.reduce((s,r)=>s+r.v,0)+np);
  const line=r=>srow('<span class="code">'+esc(r.a.code)+'</span> '+esc(acctName(r.a.code)),r.v,"",true);
  const head=k=>'<tr class="head"><td colspan="2">'+esc(t(k))+'</td></tr>';
  let html='<table><tbody>';
  html+=head("Current assets")+ca.map(line).join("")+srow(t("Total current assets"),tCA,"sub");
  html+=head("Non-current assets")+nca.map(line).join("")+srow(t("Total non-current assets"),tNCA,"sub");
  html+=srow("<b>"+esc(t("Total assets"))+"</b>",R2(tCA+tNCA),"total");
  html+=head("Current liabilities")+cl.map(line).join("")+srow(t("Total current liabilities"),tCL,"sub");
  html+=head("Non-current liabilities")+ncl.map(line).join("")+srow(t("Total non-current liabilities"),tNCL,"sub");
  html+=head("Owner\u2019s equity")+eq.map(line).join("")+
        srow(t("Profit for the period"),np,"",true)+srow(t("Total equity"),tEQ,"sub");
  html+=srow("<b>"+esc(t("Total liabilities and equity"))+"</b>",R2(tCL+tNCL+tEQ),"total");
  html+='</tbody></table>';
  const node=h('<div>'+html+'</div>');
  const diff=R2((tCA+tNCA)-(tCL+tNCL+tEQ));
  node.appendChild(h('<p style="margin-top:12px" class="'+(Math.abs(diff)>0.004?"neg":"pos")+'">'+
    (Math.abs(diff)>0.004?esc(tp("outBy",qr(diff))):esc(t("Balance sheet agrees.")))+'</p>'));
  return sheet("Statement of Financial Position",tp("asAt",fmtDate(to)),node);
}

function repGL(code,f,per){
  const rows=Ledger.rows(code,f), open=R2(Ledger.bal(code,{to:addDays(f.from,-1)}));
  let html='<table><thead><tr><th>'+esc(t("Date"))+'</th><th>'+esc(t("Voucher"))+'</th><th>'+esc(t("Source"))+'</th><th>'+esc(t("Narration"))+'</th><th class="num">'+esc(t("Debit"))+'</th><th class="num">'+esc(t("Credit"))+'</th><th class="num">'+esc(t("Balance"))+'</th></tr></thead><tbody>';
  html+='<tr><td colspan="6"><b>'+esc(t("Opening balance"))+'</b></td><td class="num"><b>'+money(open)+'</b></td></tr>';
  let run=open;
  rows.forEach(r=>{ run=R2(run+r.dr-r.cr);
    html+='<tr><td>'+fmtDate(r.date)+'</td><td class="code">'+esc(r.no)+'</td><td>'+esc(t(r.source))+'</td><td>'+esc(r.memo)+
      '</td><td class="num">'+(r.dr?money(r.dr):"")+'</td><td class="num">'+(r.cr?money(r.cr):"")+'</td><td class="num">'+money(run)+'</td></tr>'; });
  html+='<tr class="total"><td colspan="4">'+esc(t("Closing balance"))+'</td><td class="num">'+money(R2(rows.reduce((s,r)=>s+r.dr,0)))+
    '</td><td class="num">'+money(R2(rows.reduce((s,r)=>s+r.cr,0)))+'</td><td class="num">'+money(run)+'</td></tr></tbody></table>';
  return sheet("General Ledger — "+code+" "+acctName(code),per,h('<div class="scroll">'+html+'</div>'));
}

function repCB(f,per){
  const accts=DB.accounts.filter(a=>a.tag==="cash"||a.tag==="bank");
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Account"))+'</th><th>'+esc(t("Type"))+'</th><th class="num">'+esc(t("Opening"))+'</th><th class="num">'+esc(t("Received"))+'</th><th class="num">'+esc(t("Paid"))+'</th><th class="num">'+esc(t("Closing"))+'</th></tr></thead><tbody>';
  let tc=0;
  accts.forEach(a=>{
    const open=Ledger.bal(a.code,{to:addDays(f.from,-1)}), rows=Ledger.rows(a.code,f);
    const dr=R2(rows.reduce((s,r)=>s+r.dr,0)), cr=R2(rows.reduce((s,r)=>s+r.cr,0)), close=R2(open+dr-cr);
    tc=R2(tc+close);
    html+='<tr><td class="code">'+esc(a.code)+'</td><td>'+esc(acctName(a.code))+'</td><td>'+esc(t(a.tag==="bank"?"Bank":"Cash"))+
      '</td><td class="num">'+money(open)+'</td><td class="num">'+money(dr)+'</td><td class="num">'+money(cr)+
      '</td><td class="num"><b>'+money(close)+'</b></td></tr>';
  });
  html+='<tr class="total"><td colspan="6">'+esc(t("Total cash and bank balances"))+'</td><td class="num">'+money(tc)+'</td></tr></tbody></table>';
  return sheet("Cash & Bank Summary",per,h('<div class="scroll">'+html+'</div>'));
}

function repInv(per){
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Description"))+'</th><th>'+esc(t("Unit"))+'</th><th class="num">'+esc(t("Qty"))+'</th><th class="num">'+esc(t("Avg cost"))+'</th><th class="num">'+esc(t("Value"))+'</th><th class="num">'+esc(t("Sell price"))+'</th><th class="num">'+esc(t("Margin"))+' %</th></tr></thead><tbody>';
  DB.items.forEach(i=>{
    const marg=i.price?Math.round((i.price-i.cost)/i.price*100):0;
    html+='<tr><td class="code">'+esc(i.code)+'</td><td>'+esc(i.name)+'</td><td>'+esc(t(i.unit))+
      '</td><td class="num">'+money(i.qty)+'</td><td class="num">'+money(i.cost)+'</td><td class="num">'+money(R2(i.qty*i.cost))+
      '</td><td class="num">'+money(i.price)+'</td><td class="num">'+marg+'%</td></tr>';
  });
  html+='<tr class="total"><td colspan="5">'+esc(t("Total stock at weighted-average cost"))+'</td><td class="num">'+money(stockValue())+'</td><td colspan="2"></td></tr></tbody></table>';
  return sheet("Inventory Valuation",per,h('<div class="scroll">'+html+'</div>'));
}

function repExp(f,per){
  const rows=postable().filter(a=>a.type==="EXPENSE"||a.type==="COS").map(a=>({a,v:Ledger.show(a.code,f)})).filter(r=>Math.abs(r.v)>0.004)
    .sort((x,y)=>y.v-x.v);
  const tot=R2(rows.reduce((s,r)=>s+r.v,0));
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Expense"))+'</th><th>'+esc(t("Class"))+'</th><th class="num">'+esc(t("Amount"))+'</th><th class="num">'+esc(t("% of total"))+'</th></tr></thead><tbody>';
  rows.forEach(r=>html+='<tr><td class="code">'+esc(r.a.code)+'</td><td>'+esc(acctName(r.a.code))+'</td><td>'+
    esc(t(r.a.type==="COS"?"Direct cost":"Overhead"))+'</td><td class="num">'+money(r.v)+'</td><td class="num">'+(tot?Math.round(r.v/tot*100):0)+'%</td></tr>');
  html+='<tr class="total"><td colspan="3">'+esc(t("Total cost and expenses"))+'</td><td class="num">'+money(tot)+'</td><td class="num">100%</td></tr></tbody></table>';
  return sheet("Expense Analysis",per,h('<div class="scroll">'+html+'</div>'));
}

function repProj(per){
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Project"))+'</th><th>'+esc(t("Client"))+'</th><th class="num">'+esc(t("Contract value"))+'</th><th class="num">'+esc(t("Certified"))+'</th><th class="num">'+esc(t("Cost"))+'</th><th class="num">'+esc(t("Margin"))+'</th><th class="num">%</th><th>'+esc(t("Schedule"))+'</th></tr></thead><tbody>';
  let tv=0,tr=0,tc=0;
  DB.projects.forEach(p=>{
    const r=projRevenue(p.id), c=projCost(p.id), mg=R2(r-c), fl=projFlag(p);
    tv=R2(tv+p.value); tr=R2(tr+r); tc=R2(tc+c);
    html+='<tr><td class="code">'+esc(p.code)+'</td><td>'+esc(p.name)+'</td><td>'+esc(custName(p.customer))+
      '</td><td class="num">'+money(p.value)+'</td><td class="num">'+money(r)+'</td><td class="num">'+money(c)+
      '</td><td class="num '+(mg<0?"neg":"")+'">'+money(mg)+'</td><td class="num">'+(r?Math.round(mg/r*100):0)+
      '%</td><td>'+(fl.late?'<span class="tag red">'+esc(tp("daysOverdue",fl.over))+'</span>':fl.done?'<span class="tag green">'+esc(t(p.status))+'</span>':'<span class="tag">'+esc(t("On schedule"))+'</span>')+'</td></tr>';
  });
  html+='<tr class="total"><td colspan="3">'+esc(t("Total"))+'</td><td class="num">'+money(tv)+'</td><td class="num">'+money(tr)+
    '</td><td class="num">'+money(tc)+'</td><td class="num">'+money(R2(tr-tc))+'</td><td class="num">'+(tr?Math.round((tr-tc)/tr*100):0)+'%</td><td></td></tr></tbody></table>';
  return sheet("Project Profitability",per,h('<div class="scroll">'+html+'</div>'));
}

function repSched(){
  const rows=DB.projects.slice().sort((a,b)=>projFlag(b).over-projFlag(a).over);
  let html='<table><thead><tr><th>'+esc(t("Code"))+'</th><th>'+esc(t("Project"))+'</th><th>'+esc(t("Client"))+'</th>'+
    '<th>'+esc(t("Project manager"))+'</th><th>'+esc(t("Start"))+'</th><th>'+esc(t("Original end date"))+'</th>'+
    '<th>'+esc(t("Current end date"))+'</th><th class="num">'+esc(t("Slip"))+'</th><th class="num">'+esc(t("Revisions"))+'</th>'+
    '<th class="num">'+esc(t("Days over"))+'</th><th>'+esc(t("Status"))+'</th></tr></thead><tbody>';
  rows.forEach(p=>{
    const f=projFlag(p), base=p.baselineEnd||p.end, slip=daysBetween(base,p.end);
    html+='<tr'+(f.late?' style="background:var(--maroon-soft)"':'')+'><td class="code">'+esc(p.code)+'</td><td>'+
      (f.late?'<span class="flagdot"></span>':'')+esc(p.name)+'</td><td>'+esc(custName(p.customer))+'</td><td>'+
      esc(p.manager||"—")+'</td><td>'+fmtDate(p.start)+'</td><td>'+fmtDate(base)+'</td><td><b>'+fmtDate(p.end)+
      '</b></td><td class="num'+(slip>0?" neg":"")+'">'+(slip>0?"+"+slip:slip||"—")+'</td><td class="num">'+
      ((p.revisions||[]).length||"—")+'</td><td class="num'+(f.late?" neg":"")+'"><b>'+(f.late?f.over:(f.done?"—":0))+
      '</b></td><td>'+(f.late?'<span class="tag red">'+esc(t("Overdue"))+'</span>':f.done?'<span class="tag green">'+
      esc(t(p.status))+'</span>':'<span class="tag">'+esc(t("On schedule"))+'</span>')+'</td></tr>';
  });
  html+='</tbody></table>';
  const node=h('<div class="scroll">'+html+'</div>');
  const late=lateProjects().length;
  node.appendChild(h('<p style="margin-top:12px" class="'+(late?"neg":"pos")+'">'+
    (late?esc(tp("projOverdue",late)):esc(t("No overdue projects")))+'</p>'));
  return sheet("Schedule Watch",tp("asAt",fmtDate(today())),node);
}
